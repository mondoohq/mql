---
version: 2
project_name: mql
env:
  - CGO_ENABLED=0
before:
  hooks:
    - make providers/proto
builds:
  - id: linux
    main: ./apps/mql/mql.go
    binary: mql
    goos:
      - linux
    goarch:
      - amd64
      - 386
      - arm64
      - arm
      - ppc64le
      - s390x
    # ARM 6= Raspberry Pi A, A+, B, B+, Zero
    # ARM 7= Raspberry Pi 2, 3, 4
    goarm:
      - 6
      - 7
    flags:
      - -tags="production netgo"
    ldflags:
      - "-extldflags=-static"
      - -s -w -X go.mondoo.com/mql.Version={{.Version}} -X go.mondoo.com/mql.Build={{.ShortCommit}} -X go.mondoo.com/mql.Date={{.Date}}
  - id: macos
    main: ./apps/mql/mql.go
    binary: mql
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags: -tags production
    ldflags:
      # clang + macos does not support static: - -extldflags "-static"
      - -s -w -X go.mondoo.com/mql.Version={{.Version}} -X go.mondoo.com/mql.Build={{.ShortCommit}} -X go.mondoo.com/mql.Date={{.Date}}
    hooks:
      post:
        - cmd: /tmp/quill sign-and-notarize "{{ .Path }}" -vv || true
          env:
            - QUILL_LOG_FILE=/tmp/quill-{{ .Target }}.log
  - id: windows
    main: ./apps/mql/mql.go
    binary: mql
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    # -buildmode exe is required since go 1.15.0 https://github.com/golang/go/issues/40795
    flags: -tags production -buildmode exe
    ldflags:
      - "-extldflags -static"
      - -s -w -X go.mondoo.com/mql.Version={{.Version}} -X go.mondoo.com/mql.Build={{.ShortCommit}} -X go.mondoo.com/mql.Date={{.Date}}
    hooks:
      post:
        - cmd: jsign --storetype TRUSTEDSIGNING --keystore {{ .Env.TSIGN_AZURE_ENDPOINT }} --storepass {{ .Env.TSIGN_ACCESS_TOKEN }} --alias {{ .Env.TSIGN_ACCOUNT_NAME }}/{{ .Env.TSIGN_CERT_PROFILE_NAME }} '{{ .Path }}'
nfpms:
  - maintainer: Mondoo <hello@mondoo.com>
    description: Cloud-Native Asset Inventory Framework
    homepage: https://mondoo.com/
    vendor: Mondoo, Inc
    license: MPL-2.0
    formats:
      - deb
      - rpm
    overrides:
      deb:
        conflicts:
          - cnquery
        replaces:
          - cnquery
      rpm:
        conflicts:
          - cnquery
        replaces:
          - cnquery
    rpm:
      signature:
        key_file: "{{ .Env.GPG_KEY_PATH }}"
archives:
  - id: releases
    # Without this the binary keeps the build machine's user (runner, UID 1001
    # on GitHub Actions). Unpacked as root, it is then a file without an owner
    # on the machine it is installed on.
    builds_info:
      owner: root
      group: root
      mode: 0755
    format_overrides:
      - goos: windows
        format: zip
    files:
      - none*
checksum:
  name_template: "{{ .ProjectName }}_v{{ .Version }}_SHA256SUMS"
  algorithm: sha256
snapshot:
  version_template: "{{ .Tag }}-snapshot"
changelog:
  use: github-native
dockers: # https://goreleaser.com/customization/docker/
  # UBI containers
  - use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile-ubi
    image_templates:
      - "mondoo/{{ .ProjectName }}:{{ .Version }}-ubi-amd64"
      - "mondoo/{{ .ProjectName }}:{{ .Major }}-ubi-amd64"
      - "mondoo/{{ .ProjectName }}:latest-ubi-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--provenance=false"
      - "--sbom=false"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--target=root"
  - use: buildx
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile-ubi
    image_templates:
      - "mondoo/{{ .ProjectName }}:{{ .Version }}-ubi-arm64"
      - "mondoo/{{ .ProjectName }}:{{ .Major }}-ubi-arm64"
      - "mondoo/{{ .ProjectName }}:latest-ubi-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--provenance=false"
      - "--sbom=false"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--target=root"
    # Standard containers
  - use: buildx
    goos: linux
    goarch: amd64
    image_templates:
      - "mondoo/{{ .ProjectName }}:{{ .Version }}-amd64"
      - "mondoo/{{ .ProjectName }}:{{ .Major }}-amd64"
      - "mondoo/{{ .ProjectName }}:latest-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--provenance=false"
      - "--sbom=false"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--target=root"
  - use: buildx
    goos: linux
    goarch: arm64
    image_templates:
      - "mondoo/{{ .ProjectName }}:{{ .Version }}-arm64v8"
      - "mondoo/{{ .ProjectName }}:{{ .Major }}-arm64v8"
      - "mondoo/{{ .ProjectName }}:latest-arm64v8"
    build_flag_templates:
      - "--platform=linux/arm64/v8"
      - "--provenance=false"
      - "--sbom=false"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--target=root"
  - use: buildx
    goos: linux
    goarch: arm
    goarm: 6
    image_templates:
      - "mondoo/{{ .ProjectName }}:{{ .Version }}-armv6"
      - "mondoo/{{ .ProjectName }}:{{ .Major }}-armv6"
      - "mondoo/{{ .ProjectName }}:latest-armv6"
    build_flag_templates:
      - "--platform=linux/arm/v6"
      - "--provenance=false"
      - "--sbom=false"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--target=root"
  - use: buildx
    goos: linux
    goarch: arm
    goarm: 7
    image_templates:
      - "mondoo/{{ .ProjectName }}:{{ .Version }}-armv7"
      - "mondoo/{{ .ProjectName }}:{{ .Major }}-armv7"
      - "mondoo/{{ .ProjectName }}:latest-armv7"
    build_flag_templates:
      - "--platform=linux/arm/v7"
      - "--provenance=false"
      - "--sbom=false"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--target=root"
  # Rootless
  # UBI containers
  - use: buildx
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile-ubi
    image_templates:
      - "mondoo/{{ .ProjectName }}:{{ .Version }}-ubi-amd64-rootless"
      - "mondoo/{{ .ProjectName }}:{{ .Major }}-ubi-amd64-rootless"
