Features:
- desc: "Resolve similar queries the same way. If 100 assets have the same dependent
    queries and overrides, \nthey create the same resolved plan. Cannot be used with
    old resolver at the same time for asset.\n"
  end: v6.0 => default now, no need to set it anymore
  id: MassQueries
  idx: 1
  start: v3.x, available at v4.x, default at v5.x
  status: builtin
- desc: Allows MQL to use variable references across blocks. Fully changes the compiled
    code.
  end: v7.0
  id: PiperCode
  idx: 2
  start: v5.x
  status: builtin
- desc: Only boolean results are checked when evaluating a query for success
  end: v8.0
  id: BoolAssertions
  idx: 3
  start: v6.x
  status: builtin
- desc: Enables discovery of Kubernetes cluster nodes as individual assets
  end: unknown
  id: K8sNodeDiscovery
  idx: 4
  start: v6.12
  status: sunset, should be done via discovery code instead
- desc: Add context to assets for e.g. Terraform
  end: v12.0
  id: MQLAssetContext
  idx: 5
  start: v7.0
  status: new
- desc: Errors are treated as failures, see https://www.notion.so/mondoo/Errors-and-Scoring-5dc554348aad4118a1dbf35123368329
  end: v9.0
  id: ErrorsAsFailures
  idx: 6
  start: v8.x
  status: sunset, we never really used this
- desc: Stores recording-like data with upstream, can still be controlled by the server
  end: v11.0
  id: StoreResourcesData
  idx: 7
  start: v10.x
  status: default
- desc: Enables fine-grained assets discovery
  end: v12.0
  id: FineGrainedAssets
  idx: 8
  start: v11.x
  status: sunset, this is now managed via --discover
- desc: Use serial number as the asset ID
  end: v12.0
  id: SerialNumberAsID
  idx: 9
  start: v11.x
  status: default
- desc: Forces shell completion to be enabled (for windows)
  id: ForceShellCompletion
  idx: 10
  start: v11.x
  status: default
- desc: Automatically add resource context to results and prints it
  id: ResourceContext
  idx: 11
  start: v11.x
  status: default
- desc: Fail if no entrypoints or datapoints are found in the query.
  id: FailIfNoEntryPoints
  idx: 12
  start: v11.x
  status: new, we still need to fix a few more tests
- id: UploadResultsV2
  idx: 13
  start: v12.x
  status: new
- id: AutoUpdateEngine
  desc: Auto-update the execution engine
  idx: 14
  start: v13.x
  status: default
- id: BiosUUIDAsID
  desc: "Use BIOS UUID as the asset ID. Preferred over SerialNumber for VMs since some hypervisors (e.g., OpenStack) pass through the host's serial number to VMs, making it non-unique. On detected VMs, the BIOS UUID detector is added automatically; this flag enables it on non-VM (bare metal) machines."
  idx: 15
  start: v13.x
  status: new
- id: ExchangeTokenForToken
  desc: "When exchanging an external identity token with upstream (WIF), request a bearer token response (response_type=TOKEN) in place of certificate-based service-account credentials."
  idx: 16
  start: v13.x
  status: new
- id: TerraformResolveVars
  desc: "Resolve var.* and local.* references in Terraform HCL block arguments to their effective values (variable defaults overridden by .tfvars, locals evaluated from those). Unresolvable references fall back to their reference string; the unresolved view stays available via terraform.block.argumentReferences."
  end: v13.x => this is the default now, no need to set it anymore
  idx: 17
  start: v13.x
  status: builtin
- id: ScanContentModeShadow
  desc: "Compute a checksum for every row while writing the scan database, so an unchanged scan is detectable. Nothing else changes - every scan still uploads and is processed in full."
  idx: 18
  start: v13.x
  status: new
- id: ScanContentModeServerCompare
  desc: "Row checksums as in shadow; the server also skips reprocessing uploads whose rows are identical to the previous scan. Client behavior is identical to shadow."
  idx: 19
  start: v13.x
  status: new
- id: ScanContentModeClientCompare
  desc: "Row checksums as in shadow; the client may also fetch the previous upload's checksum summary, compare locally, and skip the upload entirely when nothing changed (completing with unchanged=true)."
  idx: 20
  start: v13.x
  status: new
- id: ScanContentModeNoCompare
  desc: "The kill switch: compute no checksums, always upload in full. Overrides every other ScanContentMode* feature and any client default, so the server can disable comparison per scope even after it ships as the default."
  idx: 21
  start: v13.x
  status: new
- id: UploadResourcesData
  desc: "Record resource data (the recording-style rows behind the resource explorer and GetResourcesData/ListResources) while scanning, and deliver it inside the uploaded scan database. Only acts together with UploadResultsV2 - resources ride the uploaded file, never the legacy StoreResults RPC. Successor to StoreResourcesData, which is retired: it required a server-side resolved-policy stamp as a second key and sent resources through the legacy RPC."
  idx: 22
  start: v14.x
  status: new
- id: RootedNamespace
  desc: "Compile queries against the asset root instead of the global namespace (ADR 031). A bare identifier resolves as a member of the connected asset's root, the global namespace is reachable only through resources marked @global, and a compile without a root is an error. This is the v15 model, available early so content and providers can be moved onto it before it becomes the default."
  idx: 23
  start: v14.x
  status: new
- id: StructuredErrors
  desc: "Providers return a refusal (access denied, service not enabled, ...) as a classified error instead of the null or empty value they returned in v13 (ADR 046). Checks that could not read what they assert about stop passing silently and error instead. Partial results and their coverage gaps are not behind this flag. This is the v15 behavior, available early so it can be tried against real accounts before it becomes the default."
  idx: 24
  start: v14.x
  status: new
