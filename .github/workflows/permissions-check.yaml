name: Permission Manifests

# The aws, gcp and azure providers each ship a resources/<name>.permissions.json
# listing the IAM permissions a scan needs. It is derived from provider source
# by providers-sdk/v1/util/permissions/permissions.go, which maps SDK method
# names onto permission strings heuristically, and that derivation is wrong
# whenever the SDK and IAM disagree on a name. Nothing in the build notices;
# the customer does, when a role built from the manifest is refused or does
# not grant what the scan needs. This workflow asks each cloud's own list of
# permissions whether every manifest entry can be used (see validate/aws.go,
# gcp.go and azure.go for the sources), then has each cloud accept the whole
# manifest itself (scripts/test-iam-permissions.sh): IAM Access Analyzer over
# the AWS policies, a custom role created and deleted on GCP and on Azure. It
# runs when a manifest or the tooling changes.
#
# The identities, all reached through OIDC federation from this repository: an
# AWS role allowed access-analyzer:ValidatePolicy; a GCP service account that
# can see the project and the organization and create and delete custom roles
# on both (roles/iam.roleAdmin and roles/iam.organizationRoleAdmin on a dev
# project and org); an Azure app registration with roleDefinitions/write and
# delete at a dev scope (User Access Administrator on a dev subscription). A
# pull request from a fork has no secrets and checks AWS against the public
# list only, with a warning.
on:
  pull_request:
    paths:
      - "providers/*/resources/*.permissions.json"
      - "providers-sdk/v1/util/permissions/**"
      - ".github/workflows/permissions-check.yaml"
  push:
    branches: [main]
    paths:
      - "providers/*/resources/*.permissions.json"
      - "providers-sdk/v1/util/permissions/**"
      - ".github/workflows/permissions-check.yaml"
  workflow_dispatch:

concurrency:
  group: permissions-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  id-token: write # for the two cloud logins

jobs:
  validate:
    name: Check manifests against the clouds' permission lists
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      # Secrets are empty on a pull request from a fork; the clouds that need
      # them are then skipped rather than failed.
      - name: Decide what can be validated
        id: scope
        env:
          HAS_AWS: ${{ secrets.PERMISSIONS_AWS_ROLE_ARN != '' }}
          HAS_GCP: ${{ secrets.PERMISSIONS_GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.PERMISSIONS_GCP_SERVICE_ACCOUNT != '' && secrets.PERMISSIONS_GCP_PROJECT != '' && secrets.PERMISSIONS_GCP_ORGANIZATION != '' }}
          HAS_AZURE: ${{ secrets.PERMISSIONS_AZURE_CLIENT_ID != '' && secrets.PERMISSIONS_AZURE_TENANT_ID != '' && secrets.PERMISSIONS_AZURE_SCOPE != '' }}
        run: |
          providers="providers/aws"
          if [ "$HAS_AWS" != "true" ]; then echo "::warning::AWS manifest checked against the public list only: no AWS credentials in this run"; fi
          if [ "$HAS_GCP" = "true" ]; then providers="$providers providers/gcp"; else echo "::warning::GCP manifest not validated: no GCP credentials in this run"; fi
          if [ "$HAS_AZURE" = "true" ]; then providers="$providers providers/azure"; else echo "::warning::Azure manifest not validated: no Azure credentials in this run"; fi
          echo "providers=$providers" >> "$GITHUB_OUTPUT"
          echo "aws=$HAS_AWS" >> "$GITHUB_OUTPUT"
          echo "gcp=$HAS_GCP" >> "$GITHUB_OUTPUT"
          echo "azure=$HAS_AZURE" >> "$GITHUB_OUTPUT"

      - name: Authenticate to AWS
        if: ${{ steps.scope.outputs.aws == 'true' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.PERMISSIONS_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Authenticate to Google Cloud
        if: ${{ steps.scope.outputs.gcp == 'true' }}
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.PERMISSIONS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.PERMISSIONS_GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Authenticate to Azure
        if: ${{ steps.scope.outputs.azure == 'true' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.PERMISSIONS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PERMISSIONS_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Read the Azure access token
        if: ${{ steps.scope.outputs.azure == 'true' }}
        run: |
          token=$(az account get-access-token --resource https://management.azure.com --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "AZURE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Check the manifests against the clouds' permission lists
        env:
          PROVIDERS: ${{ steps.scope.outputs.providers }}
          GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          GCP_PROJECT: ${{ secrets.PERMISSIONS_GCP_PROJECT }}
          GCP_ORGANIZATION: ${{ secrets.PERMISSIONS_GCP_ORGANIZATION }}
        run: go run ./providers-sdk/v1/util/permissions/validate $PROVIDERS

      # The second half: the clouds accept the manifests themselves.
      - name: AWS accepts the manifest (IAM Access Analyzer)
        if: ${{ steps.scope.outputs.aws == 'true' }}
        run: scripts/test-iam-permissions.sh aws-check

      - name: Set up gcloud
        if: ${{ steps.scope.outputs.gcp == 'true' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: GCP accepts the manifest (custom roles created and deleted)
        if: ${{ steps.scope.outputs.gcp == 'true' }}
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          GCP_PROJECT: ${{ secrets.PERMISSIONS_GCP_PROJECT }}
          GCP_ORGANIZATION: ${{ secrets.PERMISSIONS_GCP_ORGANIZATION }}
        run: scripts/test-iam-permissions.sh gcp-check

      - name: Azure accepts the manifest (custom role created and deleted)
        if: ${{ steps.scope.outputs.azure == 'true' }}
        env:
          AZURE_SCOPE: ${{ secrets.PERMISSIONS_AZURE_SCOPE }}
        run: scripts/test-iam-permissions.sh azure-check "$AZURE_SCOPE"
