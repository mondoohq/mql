name: Trigger provider release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      providers:
        description: 'Space-separated provider paths (e.g. "providers/gcp providers/aws")'
        required: false
        default: "providers/*/"

concurrency:
  group: release-providers
  cancel-in-progress: false

permissions:
  contents: read

env:
  # C07QZDJFF89 == #release-coordination
  SLACK_BOT_CHANNEL_ID: "C07QZDJFF89"

jobs:
  release-providers:
    # Stable releases only, until pre-release providers are designed.
    #
    # Providers publish into one `providers/<name>/<version>/` namespace behind
    # a single `providers/latest.json`, and nothing there distinguishes a
    # channel yet. A v14 pre-release bumping providers to 14.x would therefore
    # be served to every v13 client in the field, which resolves providers from
    # that same document.
    #
    # The binaries already derive a channel from the semver tag and publish to
    # `preview`; providers have not been given the equivalent. Until they are,
    # a pre-release must not start a provider release. Tracked in #10782.
    #
    # workflow_dispatch stays open so a provider release can still be run by
    # hand when that is what is wanted.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Sparse-checkout the scripts dir from main first, so we can run
      # determine-provider-release-base.sh to pick the target branch
      # before doing the full checkout. Pinned to main because on the
      # release event github.ref is the release tag (e.g. v13.35.1),
      # and the v13 branch's tag predates this script's existence.
      - name: Sparse-checkout scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: '.github/scripts'
          sparse-checkout-cone-mode: false
      # Route the provider-bump PR by asking GitHub whether a v{major}
      # support branch exists for the release's major. If yes ->
      # base=v{major}; if no -> base=main. So today (v13 branch exists,
      # main tracks v14) a v13.x release routes to v13 and a v14.x
      # release routes to main, and no config change is needed when a
      # future v14 support branch is cut. For workflow_dispatch (no
      # release event) fall back to main.
      # Logic lives in .github/scripts/determine-provider-release-base.sh
      # and is unit-tested in .github/scripts/tests/.
      - name: Determine base branch
        id: base
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAG_NAME" ]; then
            BASE=main
          else
            BASE=$(.github/scripts/determine-provider-release-base.sh "$TAG_NAME")
          fi
          echo "tag=${TAG_NAME:-<empty>} -> base=$BASE"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
      # https://github.com/peter-evans/create-pull-request/issues/48
      # https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#push-using-ssh-deploy-keys
      # tl;dr:
      # The GITHUB_TOKEN is limited when creating PRs from a workflow
      # because of that we use a ssh key for which the limitations do not apply
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.CNQUERY_DEPLOY_KEY_PRIV }}
          fetch-depth: 0
          ref: ${{ steps.base.outputs.base }}

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.protoc-version }}

      - name: Validate provider paths
        id: validate
        env:
          PROVIDERS_INPUT: ${{ inputs.providers || 'providers/*/' }}
        run: |
          # Ensure each entry matches providers/<name> or providers/<name>/
          for p in $PROVIDERS_INPUT; do
            if ! [[ "$p" =~ ^providers/[a-zA-Z0-9*_-]+/?$ ]]; then
              echo "::error::Invalid provider path: '$p'. Must match providers/<name>/"
              exit 1
            fi
          done

          # Resolve globs and verify at least one directory exists
          RESOLVED=""
          for p in $PROVIDERS_INPUT; do
            for d in $p; do
              if [ -d "$d" ]; then
                RESOLVED="$RESOLVED $d"
              fi
            done
          done
          RESOLVED=$(echo "$RESOLVED" | xargs)
          if [ -z "$RESOLVED" ]; then
            echo "::error::No matching provider directories found for: $PROVIDERS_INPUT"
            exit 1
          fi
          echo "PROVIDERS=$RESOLVED" >> "$GITHUB_OUTPUT"

      - name: Update provider versions
        id: update-providers
        env:
          PROVIDERS: ${{ steps.validate.outputs.PROVIDERS }}
        run: |
          go run providers-sdk/v1/util/version/version.go update \
            $PROVIDERS --increment=patch --output=.version-output

      - name: Prepare title, body, and branch name
        id: branch
        run: |
          if [ -f .version-output/title.txt ]; then
            COMMIT_TITLE=$(cat .version-output/title.txt)
          else
            echo "No providers updated, skipping PR creation"
            echo "SKIP=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Read body and export via GITHUB_OUTPUT (using a random delimiter to avoid collisions)
          BODY=$(cat .version-output/body.md)
          DELIM="BODY_EOF_$(openssl rand -hex 8)"
          {
            echo "BODY<<$DELIM"
            echo "$BODY"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

          BRANCH_NAME="version/providers_update_$(date +%Y%m%d_%H%M)"
          echo "COMMIT_TITLE=${COMMIT_TITLE}" >> $GITHUB_OUTPUT
          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_OUTPUT

      - name: Clean up generated output files
        if: ${{ steps.branch.outputs.SKIP != 'true' }}
        run: rm -rf .version-output

      # We have to use this extension, because `gh pr create` does not support the ssh key case
      - name: Create pull request
        if: ${{ steps.branch.outputs.SKIP != 'true' }}
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ steps.base.outputs.base }}
          labels: providers
          committer: "Mondoo Tools <tools@mondoo.com>"
          author: "Mondoo Tools <tools@mondoo.com>"
          commit-message: ${{ steps.branch.outputs.COMMIT_TITLE }}
          title: ${{ steps.branch.outputs.COMMIT_TITLE }}
          branch: ${{ steps.branch.outputs.BRANCH_NAME }}
          body: ${{ steps.branch.outputs.BODY }}

      - name: PR infos
        if: ${{ steps.branch.outputs.SKIP != 'true' && steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"

      - name: Send Slack notification
        if: ${{ steps.branch.outputs.SKIP != 'true' && steps.cpr.outputs.pull-request-number }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ env.SLACK_BOT_CHANNEL_ID }}",
              "text": "✨ Provider release PR created",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *Provider release PR created*: <${{ steps.cpr.outputs.pull-request-url }}|${{ steps.branch.outputs.COMMIT_TITLE }}>\nThis PR is ready for review."
                  }
                }
              ]
            }
