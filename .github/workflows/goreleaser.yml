name: goreleaser

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      skip-publish:
        description: "Skip publishing to releases.mondoo.com?"
        type: boolean
        required: false
        default: false
      use-test-cert:
        description: "Use test certificate profile (not publicly trusted)"
        required: false
        default: false
        type: boolean
      goreleaser-snapshot:
        description: "Run goreleaser in snapshot mode, which will not publish and bypass tag checks."
        required: false
        default: false
        type: boolean
      upload-artifacts:
        description: "Uploading artifacts to workflow"
        required: false
        default: false
        type: boolean
      skip-cnspec-bump:
        description: "Skip triggering mql version bump in cnspec"
        required: false
        default: false
        type: boolean
      make-latest:
        description: "Mark GitHub release as 'latest'"
        required: false
        default: true
        type: boolean

env:
  REGISTRY: docker.io
  # C07QZDJFF89 == #release-coordination
  SLACK_BOT_CHANNEL_ID: "C07QZDJFF89"

permissions:
  contents: read

jobs:
  goreleaser:
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    permissions:
      # Add "contents" to write release
      contents: "write"
      # Add "id-token" for google-github-actions/auth
      id-token: "write"

    runs-on:
      group: arc-runners
    environment: prod
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Dump all inputs
        run: |
          echo "${{ toJSON(inputs) }}"
          echo "github.ref: ${{ github.ref }}"
          echo "github.ref_name: ${{ github.ref_name }}"
          echo "github.event_name: ${{ github.event_name }}"
      # A tag's release channel is derived from its semver pre-release segment,
      # never declared: `14.0.0-rc.2` is preview, `13.38.1` is stable, and build
      # metadata (`8.4.0+41`) is not a pre-release so it stays stable. This
      # replaces a substring test for alpha/beta/pre/rc that disagreed with the
      # equivalent lists in cnspec and in the publishing tools. The rule is
      # SemVer 9 and 10 with nothing added: everything after a `-` and before
      # any `+` is the pre-release segment, and its presence is the channel.
      - name: Determine release channel
        id: channel
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "not a tag ($REF_NAME), treating as stable"
            echo "channel=stable" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Build metadata is everything after a `+`, and SemVer 10 says it MUST
          # be ignored when determining precedence. So `v14.0.0+rc.1` does not
          # mean "release candidate": it compares EQUAL to `14.0.0`, outranks
          # every real `14.0.0-rc.N`, derives the stable channel, and ships to
          # every user on their next update check. A pre-release is introduced
          # with `-`, never `+`.
          #
          # This is worth failing on rather than warning about, because
          # everything downstream would accept it happily.
          #
          # The boundaries on both sides keep the marker list from firing on
          # real words that merely contain one of them. Verified:
          #   rejects: +rc.1 +alpha3 +pre-2 +preview +edge.7 +test +next.1
          #   allows:  +3508 +build.7 +attestation +contest +greatest +latest
          #            +protest +nextcloud +edgecase
          META="${REF_NAME#*+}"
          if [ "$META" != "$REF_NAME" ]; then
            if printf '%s' "$META" | grep -Eiq '(^|[.-])(pre|rc|alpha|beta|dev|canary|nightly|snapshot|preview|edge|test|next)([.-]|[0-9]|$)'; then
              echo "::error::tag $REF_NAME puts a pre-release marker in build metadata. Build metadata is ignored for precedence, so this tag means the FINAL ${REF_NAME%%+*} and would publish to the stable channel. Use a hyphen: ${REF_NAME%%+*}-${META}"
              exit 1
            fi
            echo "::warning::tag $REF_NAME carries build metadata (+${META}), which is ignored when comparing versions"
          fi

          CORE="${REF_NAME#v}"
          CORE="${CORE%%+*}"
          if ! printf '%s' "$CORE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $REF_NAME is not a semver version, so its release channel cannot be derived"
            exit 1
          fi

          case "$CORE" in
            *-*) CHANNEL=preview ;;
            *)   CHANNEL=stable ;;
          esac

          echo "$REF_NAME -> channel=$CHANNEL"
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

      # A pre-release still builds and still gets a GitHub release; what it must
      # not do is promote `latest` or start the cnspec release train.
      - name: Skip Publish for non-release tags
        id: skip-publish
        if: steps.channel.outputs.channel != 'stable' || inputs.skip-publish == true
        run: |
          echo "Skipping publish for non-release tags"
          echo "skip-publish=true" >> $GITHUB_OUTPUT
          echo "skip-publish=true" >> $GITHUB_ENV

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.protoc-version }}

      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIP }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: "Write RPM Signing Cert"
        run: |
          gpgkey="$(mktemp -t gpgkey.XXX)"
          base64 -d <<<"$GPG_KEY" > "$gpgkey"
          echo "GPG_KEY_PATH=$gpgkey" >> $GITHUB_ENV
        env:
          GPG_KEY: "${{ secrets.GPG_KEY}}"

      # jsign and azure-cli are both requirements for Azure Trusted Signing and these actions to authenticate
      # These packages have been installed on the self-hosted runner using ansible from the private repo

      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.TSIGN_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.TSIGN_AZURE_TENANT_ID}}
          subscription-id: ${{ vars.TSIGN_AZURE_SUBSCRIPTION_ID }}

      - name: Get Azure AD Access Token to trusted signing
        id: get_token
        run: |
          set -e  # Stop on first error
          TSIGN_ACCESS_TOKEN=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)

          if [ -z "$TSIGN_ACCESS_TOKEN" ]; then
            echo "Error: Access token is empty"
            exit 1
          fi
          PREFIX="${TSIGN_ACCESS_TOKEN:0:8}"
          echo "Access token prefix: ${PREFIX}..."
          echo "TSIGN_ACCESS_TOKEN=$TSIGN_ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Install Quill for Mac Signing and Notarization
        run: |
          # anchore/quill v0.5.1
          curl -sSfL https://raw.githubusercontent.com/anchore/quill/026e6f927f9b7ddfc764f205fd681cdc2be9380e/install.sh | sh -s -- -b /tmp
          /tmp/quill help

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Run GoReleaser
      # This will build the binaries, create the docker images, and publish the release to Git
      # we are currently pinned to v2.5.1 because of a bug in v2.6.0 that causes the release to fail
      # specifically with the signing of the RPM packages
      # if you upgrade then when validating the signatures 'rpm -qpi dist/*.rpm' it will error with
      # Header RSA signature: BAD (package tag 268: invalid OpenPGP signature)
      # This is because a goreleaser dep was changed to https://github.com/goreleaser/nfpm/releases/tag/v2.41.2
      # created a discussion on the issue here https://github.com/orgs/goreleaser/discussions/5943

      - name: Run GoReleaser and promote latest
        if: ${{ steps.skip-publish.outputs.skip-publish != 'true' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.5.1
          args: >
            release
            --config .goreleaser.yml
            --clean
            --timeout 120m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERT_PASSWORD: ${{ steps.gcp_secrets.outputs.code_sign_cert_challenge }}
          NFPM_DEFAULT_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          QUILL_SIGN_PASSWORD: ""
          QUILL_SIGN_P12: ${{ secrets.APPLE_SIGN_P12 }}
          QUILL_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          QUILL_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          TSIGN_AZURE_ENDPOINT: ${{ vars.TSIGN_AZURE_ENDPOINT }}
          TSIGN_ACCOUNT_NAME: ${{ vars.TSIGN_ACCOUNT_NAME }}
          TSIGN_CERT_PROFILE_NAME: ${{ github.event.inputs.use-test-cert == 'true' && vars.TSIGN_TEST_CERT_PROFILE_NAME || vars.TSIGN_CERT_PROFILE_NAME }}
          TSIGN_ACCESS_TOKEN: ${{ steps.get_token.outputs.TSIGN_ACCESS_TOKEN }}
          MAKE_LATEST: ${{ inputs.make-latest == false && 'false' || 'true' }}

      - name: Run GoReleaser without promoting 'latest'
        if: ${{ steps.skip-publish.outputs.skip-publish == 'true' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.5.1
          args: >
            release
            ${{ inputs.goreleaser-snapshot == true && '--snapshot' || '' }}
            --config .github/.goreleaser-unstable.yml
            --clean
            --timeout 120m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERT_PASSWORD: ${{ steps.gcp_secrets.outputs.code_sign_cert_challenge }}
          NFPM_DEFAULT_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          QUILL_SIGN_PASSWORD: ""
          QUILL_SIGN_P12: ${{ secrets.APPLE_SIGN_P12 }}
          QUILL_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          QUILL_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          QUILL_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          TSIGN_AZURE_ENDPOINT: ${{ vars.TSIGN_AZURE_ENDPOINT }}
          TSIGN_ACCOUNT_NAME: ${{ vars.TSIGN_ACCOUNT_NAME }}
          TSIGN_CERT_PROFILE_NAME: ${{ github.event.inputs.use-test-cert == 'true' && vars.TSIGN_TEST_CERT_PROFILE_NAME || vars.TSIGN_CERT_PROFILE_NAME }}
          TSIGN_ACCESS_TOKEN: ${{ steps.get_token.outputs.TSIGN_ACCESS_TOKEN }}
          MAKE_LATEST: ${{ inputs.make-latest == false && 'false' || 'true' }}

      - name: Install rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Check RPMs
        run: |
          rpm -qpi dist/*.rpm

      - name: Output Quill Logs
        if: ${{ failure() }}
        run: |
          for f in $(find /tmp -name 'quill-*.log' 2>/dev/null); do
            echo "=== $f ==="
            ls -l $f
            cat $f
          done

      - name: Upload artifacts
        if: ${{ inputs.upload-artifacts == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-artifacts
          path: dist/*.zip
          retention-days: 7

      # At this point we know the docker container is published.
      # We can now trigger the mql bump in cnspec, which will also trigger the release of cnspec.
      # The docker container is a pre-requisite for cnspec release.
      # Fires for every tag, pre-release included. Which channel a tag belongs
      # to is derived from its semver pre-release segment, and that decides what
      # gets promoted -- not whether cnspec is bumped. cnspec's bump workflow
      # handles a pre-release version and the unversioned mql module path on its
      # side (cnspec#3603).
      #
      # Deliberately NOT gated on steps.skip-publish. That step answers two
      # different questions at once -- "is the channel non-stable?" and "did the
      # operator ask us not to publish?" -- and only the first should stop the
      # bump. The operator opt-outs are therefore spelled out here, so dropping
      # the channel block cannot silently drop them too: `skip-publish` means
      # mql never reaches the bucket, and a cnspec release pinned to an mql
      # version that was never published is not something to kick off.
      - name: Trigger mql bump in cnspec
        if: ${{ github.event_name == 'push' || (inputs.skip-cnspec-bump != true && inputs.skip-publish != true && inputs.make-latest != false) }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.RELEASR_ACTION_TOKEN }}
          repository: "mondoohq/cnspec"
          event-type: update-mql
          # toJSON, not a raw interpolation into a quoted JSON string: git
          # allows `"` and `\` in a ref name, either of which would produce
          # malformed JSON and a dispatch the other repo cannot parse. Matches
          # how cnspec builds the same kind of payload.
          client-payload: >-
            {"version": ${{ toJSON(github.ref_name) }}}

  # Reports the release outcome to #release-coordination.
  #
  # Nothing depends on this job, and it never gates the release: a Slack outage,
  # a rotated token or a renamed channel must not turn a good release red. It
  # runs on failure too, because a release that did not happen is the case most
  # worth announcing.
  notify:
    name: Report the release to Slack
    if: ${{ always() && github.ref_type == 'tag' }}
    needs: [goreleaser]
    runs-on: ubuntu-latest
    steps:
      - name: Compose the message
        id: meta
        env:
          CHANNEL: ${{ needs.goreleaser.outputs.channel }}
          BUILD: ${{ needs.goreleaser.result }}
          # Through env rather than `${{ }}` inline: an expression is pasted into
          # the script before bash parses it, so a tag carrying a quote or `$(…)`
          # would be read as shell rather than as text.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The tag reaches Slack through two different parsers, and it is not
          # validated anywhere upstream -- git allows `"`, `&`, `<` and `>` in a
          # ref name. `ref_safe` is escaped for both: backslash and quote so the
          # value cannot terminate the double-quoted YAML scalar it is pasted
          # into (that one fails the whole step, not just the rendering), then
          # the three characters Slack reads as markup. `ref_url` is for the
          # link target, where percent-encoding rather than escaping is correct.
          ref_safe=$REF_NAME
          ref_safe=${ref_safe//\\/\\\\}
          ref_safe=${ref_safe//\"/\\\"}
          ref_safe=${ref_safe//&/&amp;}
          ref_safe=${ref_safe//</&lt;}
          ref_safe=${ref_safe//>/&gt;}
          ref_url=$(jq -rn --arg v "$REF_NAME" '$v|@uri')
          {
            echo "version=$ref_safe"
            echo "version_url=$ref_url"
          } >> "$GITHUB_OUTPUT"

          # build_status carries the value alone. Its label and the newline stay
          # in the Slack payload, where `\n` inside a double-quoted YAML scalar
          # is a real escape -- a `\n` that arrives by substitution only renders
          # because of when GitHub interpolates, which is not worth depending on.
          case "$BUILD" in
            success)
              echo "header=:rocket: mql $ref_safe released" >> "$GITHUB_OUTPUT"
              echo "mention=" >> "$GITHUB_OUTPUT"
              echo "build_status=:white_check_mark: Done" >> "$GITHUB_OUTPUT"
              ;;
            skipped)
              echo "header=:double_vertical_bar: mql $ref_safe build skipped" >> "$GITHUB_OUTPUT"
              echo "mention=" >> "$GITHUB_OUTPUT"
              echo "build_status=:double_vertical_bar: Skipped" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "header=:x: mql $ref_safe failed to release" >> "$GITHUB_OUTPUT"
              echo "mention=<!here> " >> "$GITHUB_OUTPUT"
              echo "build_status=:x: $BUILD" >> "$GITHUB_OUTPUT"
              ;;
          esac

          # cnspec carries the user-facing release; mql being on preview tells a
          # reader why nothing was promoted to latest. The cnspec bump PR opens
          # either way now, so its absence would be a real problem rather than
          # an expected consequence of the channel.
          case "$CHANNEL" in
            preview) echo "channel_line=:test_tube: *preview* — not promoted to latest; the cnspec bump is dispatched as usual" >> "$GITHUB_OUTPUT" ;;
            *)       echo "channel_line=:package: *stable* — promotes latest and triggers the cnspec bump" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Post to Slack
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            text: "${{ steps.meta.outputs.mention }}${{ steps.meta.outputs.header }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "${{ steps.meta.outputs.header }}"
                  emoji: true
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.meta.outputs.channel_line }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository:*\n`${{ github.repository }}`"
                  - type: "mrkdwn"
                    text: "*Version:*\n`${{ steps.meta.outputs.version }}`"
                  - type: "mrkdwn"
                    text: "*Triggered by:*\n${{ github.actor }}"
                  - type: "mrkdwn"
                    text: "*Workflow run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run>"
                  - type: "mrkdwn"
                    text: "*Build:*\n${{ steps.meta.outputs.build_status }}"
                  - type: "mrkdwn"
                    text: "*Release notes:*\n<https://github.com/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.version_url }}|${{ steps.meta.outputs.version }}>"
