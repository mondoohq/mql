name: "Build & Release Providers"

on:
  push:
    branches: ["v13", "main"]
    paths: ["providers/**"]
  workflow_dispatch:
    inputs:
      providers:
        description: "Only consider these providers (space or comma separated). Empty considers all."
        type: string
        required: false
      build_all:
        description: "Force build all providers"
        type: boolean
        required: false
        default: false
      skip_publish:
        description: "Skip publishing"
        type: boolean
        required: false
        default: false
      allow_major_promotion:
        description: "Allow publishing a new major to the stable channel"
        type: boolean
        required: false
        default: false
      use-test-cert:
        description: "Use test certificate profile (not publicly trusted)"
        required: false
        default: false
        type: boolean
      max_parallel:
        description: "Max parallel arch builds per provider (leave empty to auto-detect from physical cores)"
        type: number
        required: false

permissions:
  contents: read

env:
  BUCKET: releases-us.mondoo.io
  # Builtin providers ship inside the binary, not through the registry. They
  # have no main.go to build and their version is mql.GetVersion() rather than
  # a quoted literal, so the version check below reads an empty string, never
  # matches the published one, and would try to build them on every push.
  SKIP_PROVIDERS: "core iac"
  # C07QZDJFF89 == #release-coordination
  SLACK_BOT_CHANNEL_ID: "C07QZDJFF89"

jobs:
  scoping:
    name: "Scoping"
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      providers: ${{ steps.providers.outputs.providers }}
      build_list: ${{ steps.providers.outputs.build_list }}
      # Consumed only by `notify`. `blocked` is set on the major-promotion
      # refusal and survives the step's own `exit 1`: a step's outputs are
      # read from the file regardless of its exit code, which is what lets
      # the refusal reach Slack instead of dying in a collapsed log.
      blocked: ${{ steps.providers.outputs.blocked }}
      promotions: ${{ steps.providers.outputs.promotions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Dump all inputs
        run: echo "${{ toJSON(inputs) }}"

      - name: Detect providers
        id: providers
        env:
          ALLOW_MAJOR_PROMOTION: ${{ inputs.allow_major_promotion }}
          ONLY_PROVIDERS: ${{ inputs.providers }}
        run: |
          providers=$(find providers -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)

          # Restrict the run to named providers. Without this, the first run on a
          # branch whose versions have all moved builds every provider at once,
          # which is not something to discover in production. An unknown name is an
          # error rather than an empty build, so a typo cannot look like "nothing to do".
          if [ -n "$ONLY_PROVIDERS" ]; then
            requested=$(echo "$ONLY_PROVIDERS" | tr ',' ' ')
            selected=""
            for r in $requested; do
              found=0
              for p in $providers; do
                if [ "$p" = "$r" ]; then
                  found=1
                  # Built without a leading space. `echo -n $providers` below is
                  # unquoted and would trim one, but not depending on that keeps the
                  # value correct if the line is ever quoted.
                  selected="${selected:+$selected }$r"
                fi
              done
              if [ "$found" = "0" ]; then
                echo "::error::requested provider '$r' does not exist under providers/"
                exit 1
              fi
            done
            providers=$selected
            echo "=== RESTRICTED TO:$providers ==="
          fi
          echo "providers=$(echo -n $providers | jq -Rsc 'split(" ")')" >> $GITHUB_OUTPUT
          build=""
          root=$PWD
          for p in $providers; do
            skip=0
            for s in $SKIP_PROVIDERS; do
              if [[ $p == $s ]]; then
                skip=1
              fi
            done
            if [[ $skip == 1 ]]; then
              echo "$p is on the skip list. Skipping."
              continue
            fi
            cd providers/$p
            # Anchor on the Version field. A bare `grep Version:` also matches the
            # MinVersion entries in the Requires block. Those exist on main and not
            # on v13, so REPO_VERSION became a multi-line string that can never equal
            # DIST_VERSION, and every provider would rebuild on every push.
            REPO_VERSION=$(grep -m1 -E '^[[:space:]]*Version:' config/config.go | cut -f2 -d\")

            # Compare against the pointer for the channel this version belongs to.
            # A pre-release publishes to preview and never changes latest.json, so
            # comparing it against latest.json is a second comparison that never
            # converges: it would republish the same version on every push.
            case "$REPO_VERSION" in
              *-*) POINTER="preview.json" ;;
              *)   POINTER="latest.json" ;;
            esac
            STATUS_CODE=$(curl -s -o /dev/null -I -w "%{http_code}" https://releases.mondoo.com/providers/${p}/${POINTER})
            if [ "$STATUS_CODE" -eq "404" ]; then
              DIST_VERSION="unreleased"
            else
              DIST_VERSION=$(curl -s https://releases.mondoo.com/providers/${p}/${POINTER} | jq -r .version)
            fi
            printf "PROVIDER $p:\n  Local version: $REPO_VERSION\n  Remote version: $DIST_VERSION (from $POINTER)\n"

            # Providers share one namespace across release lines, and every
            # client resolves through providers/latest.json -- whatever is
            # newest there is what the whole fleet installs. A version carrying
            # a semver pre-release segment lands on the preview channel and is
            # invisible to stable clients; a plain one does not.
            #
            # So a plain version whose major is ahead of what stable currently
            # serves would hand every client on the previous major a provider
            # built for the next one, as a side effect of a routine bump. Refuse
            # it. Promoting a major is deliberate: re-run with
            # allow_major_promotion.
            if [[ "$DIST_VERSION" != "unreleased" ]]; then
              REPO_MAJOR=${REPO_VERSION%%.*}
              DIST_MAJOR=${DIST_VERSION%%.*}
              if [[ "$REPO_VERSION" != *-* && "$REPO_MAJOR" -gt "$DIST_MAJOR" ]]; then
                if [[ "$ALLOW_MAJOR_PROMOTION" != "true" ]]; then
                  # Record the refusal for `notify` before failing, so the reason
                  # reaches the release channel and not just this log. Delimited
                  # rather than `key=value`: a value carrying a newline would
                  # otherwise truncate the file and swallow later outputs.
                  {
                    echo "blocked<<__MQL_EOF__"
                    echo "$p $REPO_VERSION would promote major $REPO_MAJOR to stable, where $DIST_VERSION serves every client on major $DIST_MAJOR."
                    echo "__MQL_EOF__"
                  } >> $GITHUB_OUTPUT
                  echo "::error::$p $REPO_VERSION would promote major $REPO_MAJOR to the stable channel, where $DIST_VERSION is serving every client on major $DIST_MAJOR. Give it a pre-release segment (e.g. ${REPO_MAJOR}.0.0-rc.1) to publish it to preview, or re-run with allow_major_promotion to promote it deliberately."
                  exit 1
                fi
                # Deliberate promotion: worth naming in the release message,
                # because it is the one change a reader must not miss.
                promotions="${promotions:+$promotions, }$p $DIST_MAJOR to $REPO_MAJOR"
              fi
            fi

            if [[ $REPO_VERSION != $DIST_VERSION ]]; then
              echo "  Adding $p to build list"
              build="$build $p"
            else
              echo "  Skipping: Provider version unchanged."
            fi
            cd $root
          done

          echo "build_list=$(echo -n $build | jq -Rsc 'split(" ")')" >> $GITHUB_OUTPUT
          {
            echo "promotions<<__MQL_EOF__"
            echo "${promotions:-}"
            echo "__MQL_EOF__"
          } >> $GITHUB_OUTPUT

          build_all=${{ github.event.inputs.build_all }}
          if [[ $build_all == true ]]; then
            echo "=== BUILD OF ALL PROVIDERS FORCED ==="
            printf '%s\n' "${providers[@]}" | jq -R . | jq -sc . > providers.json
            echo "build_list=$(cat providers.json)" >> $GITHUB_OUTPUT
          fi

      - name: Build List
        run: |
          echo "=== Providers detected:"
          echo '${{ steps.providers.outputs.providers }}'

          echo "=== Providers selected to build:"
          echo '${{ steps.providers.outputs.build_list }}'

  provider-build:
    name: "${{ matrix.provider }}"
    runs-on:
      group: arc-runners
    environment: prod
    timeout-minutes: 120
    permissions:
      contents: "read"
      # Add "id-token" for OIDC Azure Login
      id-token: "write"
    needs: scoping
    if: ${{ needs.scoping.outputs.build_list != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider: ${{ fromJSON(needs.scoping.outputs.build_list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.protoc-version }}

      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_RELEASE_SERVICE_ACCOUNT}}

      - name: "Set up gcloud CLI"
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1

      # jsign and azure-cli are both requirements for Azure Trusted Signing and these actions to authenticate
      # These packages have been installed on the self-hosted runner using ansible from the private repo

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.TSIGN_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.TSIGN_AZURE_TENANT_ID}}
          subscription-id: ${{ vars.TSIGN_AZURE_SUBSCRIPTION_ID }}

      - name: Get Azure AD Access Token to trusted signing
        id: get_token
        run: |
          set -e  # Stop on first error
          TSIGN_ACCESS_TOKEN=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)

          if [ -z "$TSIGN_ACCESS_TOKEN" ]; then
            echo "Error: Access token is empty"
            exit 1
          fi
          PREFIX="${TSIGN_ACCESS_TOKEN:0:8}"
          echo "Access token prefix: ${PREFIX}..."
          echo "TSIGN_ACCESS_TOKEN=$TSIGN_ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: "Build dependencies"
        run: |
          make providers/proto
          make providers/lr

      - name: "Build Provider"
        id: build-providers
        run: |
          rm -rf ./dist
          scripts/provider_bundler.sh ${{ matrix.provider }}
        env:
          TSIGN_AZURE_ENDPOINT: ${{ vars.TSIGN_AZURE_ENDPOINT }}
          TSIGN_ACCOUNT_NAME: ${{ vars.TSIGN_ACCOUNT_NAME }}
          TSIGN_CERT_PROFILE_NAME: ${{ github.event.inputs.use-test-cert == 'true' && vars.TSIGN_TEST_CERT_PROFILE_NAME || vars.TSIGN_CERT_PROFILE_NAME }}
          TSIGN_ACCESS_TOKEN: ${{ steps.get_token.outputs.TSIGN_ACCESS_TOKEN }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}

      - name: "Publish Provider"
        if: ${{ ! inputs.skip_publish }}
        run: |
          for pkg in $(ls dist | cut -f1,2 -d_ | uniq); do
            PROVIDER=$(echo $pkg | cut -f1 -d_)
            VERSION=$(echo $pkg | cut -f2 -d_)
            echo "Publishing $pkg: $PROVIDER $VERSION"

            echo "Publishing $pkg to gs://${BUCKET}/providers/${PROVIDER}/${VERSION}/"
            gsutil -m cp -c dist/${pkg}*.xz gs://${BUCKET}/providers/${PROVIDER}/${VERSION}/
            gsutil -m cp -c dist/${pkg}_SHA256SUMS gs://${BUCKET}/providers/${PROVIDER}/${VERSION}/
            gsutil -m cp -c dist/${pkg}_schema.json gs://${BUCKET}/providers/${PROVIDER}/${VERSION}/schema.json
            gsutil -m cp -c dist/${pkg}_provider.json gs://${BUCKET}/providers/${PROVIDER}/${VERSION}/provider.json
          done

      - name: "Save Artifacts"
        if: ${{ inputs.skip_publish }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.provider }}
          path: dist


  provider-index:
    needs: [provider-build, scoping]
    runs-on: ubuntu-latest
    if: ${{ ! inputs.skip_publish }}
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MONDOO_MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MONDOO_MERGEBOT_APP_PRIVATE_KEY }}
          owner: mondoohq
          repositories: |
            releasr
            docs

      - name: Trigger Reindex of releases.mondoo.com
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          repository: "mondoohq/releasr"
          event-type: reindex
          client-payload: '{
            "apps": "providers"
            }'

      - name: Trigger MQL resources update in mondoohq/docs
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          repository: "mondoohq/docs"
          event-type: update-mql-resources
          client-payload: '{
              "mql_sha": "${{ github.sha }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }'

  # Reports the provider release to the release channel.
  #
  # One message per run, not one per provider: the notifier used to live inside
  # the build matrix, so a full release posted 81 separate lines and the summary
  # had to be reassembled by hand from the channel.
  #
  # Nothing depends on this job and the post is continue-on-error: a Slack
  # outage, a rotated token or a renamed channel must never turn a good release
  # red. It runs on failure too, because a release that did not happen is the
  # case most worth announcing -- including the major-promotion refusal, which
  # otherwise fails the run without saying why anywhere a person will look.
  notify:
    name: Report the provider release to Slack
    if: ${{ always() && ! inputs.skip_publish }}
    needs: [scoping, provider-build, provider-index]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading the run's own jobs is how per-provider outcomes are recovered.
      # The matrix job is named `${{ matrix.provider }}`, so the job list is
      # already a provider-to-result mapping and no artifact plumbing is needed.
      actions: read
    steps:
      - name: Compose the message
        id: meta
        env:
          # Through env rather than inline `${{ }}`: an expression is pasted in
          # before bash parses the script, so a value carrying a quote or `$(…)`
          # would be read as shell rather than as text.
          BLOCKED: ${{ needs.scoping.outputs.blocked }}
          PROMOTIONS: ${{ needs.scoping.outputs.promotions }}
          BUILD_LIST: ${{ needs.scoping.outputs.build_list }}
          SCOPING: ${{ needs.scoping.result }}
          BUILD: ${{ needs.provider-build.result }}
          INDEX: ${{ needs.provider-index.result }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Composed values are pasted into the double-quoted YAML scalars of the
          # payload below and then rendered as Slack mrkdwn, so escape for both:
          # backslash and quote so a value cannot terminate the scalar (which
          # fails the whole step, not just the rendering), then the three
          # characters Slack reads as markup.
          esc() {
            printf '%s' "$1" \
              | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' \
                    -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          # Values reach $GITHUB_OUTPUT through a delimiter rather than
          # `key=value`: a newline in a value would otherwise truncate the file
          # and silently swallow every output written after it.
          emit() { printf '%s<<__MQL_EOF__\n%s\n__MQL_EOF__\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }

          planned=$(printf '%s' "${BUILD_LIST:-[]}" | jq -r 'length' 2>/dev/null || echo 0)

          # Per-provider outcomes from the run's own job list. Anything that is
          # not a matrix leg (scoping, provider-index, this job) is filtered out
          # by intersecting with the planned build list.
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | [.name, (.conclusion // "running")] | @tsv' > jobs.tsv || : > jobs.tsv
          printf '%s' "${BUILD_LIST:-[]}" | jq -r '.[]' > planned.txt 2>/dev/null || : > planned.txt

          ok=0; bad=0; failed=""
          while IFS= read -r prov; do
            [ -n "$prov" ] || continue
            res=$(awk -F'\t' -v p="$prov" '$1==p{print $2; exit}' jobs.tsv)
            case "$res" in
              success|skipped) ok=$((ok+1)) ;;
              "")              ;;
              *)               bad=$((bad+1)); failed="${failed:+$failed, }$prov" ;;
            esac
          done < planned.txt

          # Most runs on providers/** touch provider code without bumping a
          # version, so the "nothing to release" branch fired on 22 of 30
          # consecutive runs. A channel that is mostly no-ops trains people to
          # stop reading it, which costs exactly the messages this job exists to
          # deliver. Each branch decides whether it is worth interrupting for.
          post=true

          if [ -n "${BLOCKED:-}" ]; then
            header=":no_entry: Provider release blocked"
            mention="<!here> "
            detail="$(esc "$BLOCKED")  _To proceed: re-run with *allow_major_promotion*, or give the version a pre-release segment (e.g. 14.0.0-rc.1) to publish it to preview._"
          elif [ "$SCOPING" != "success" ]; then
            header=":x: Provider release failed during scoping"
            mention="<!here> "
            detail="Scoping did not complete, so nothing was built."
          elif [ "$planned" = "0" ]; then
            # Nothing to release and nothing broke: the run is a no-op and the
            # Actions tab already records it. Stay quiet.
            post=false
            header=":white_check_mark: No provider changes to release"
            mention=""
            detail="Every provider version already matches what the channel serves."
          elif [ "$bad" -gt 0 ]; then
            header=":x: Providers released - $ok of $planned, $bad failed"
            mention="<!here> "
            detail="*Failed:* $(esc "$failed")"
          else
            header=":rocket: Providers released - $ok of $planned"
            mention=""
            detail=":package: *stable* - this is what a default install gets"
          fi

          if [ -n "${PROMOTIONS:-}" ]; then
            detail="$detail  :warning: *Major promotion:* $(esc "$PROMOTIONS")"
          fi

          # `skipped` is not `failed`: provider-index is skipped by design on a
          # no-publish run, and reporting that red would train everyone to
          # ignore the colour.
          status() {
            case "$1" in
              success) echo ":white_check_mark: Done" ;;
              skipped) echo ":double_vertical_bar: Skipped" ;;
              "")      echo ":grey_question: Not run" ;;
              *)       echo ":x: $1" ;;
            esac
          }

          emit post "$post"
          emit header "$header"
          emit mention "$mention"
          emit detail "$detail"
          emit build_status "$(status "$BUILD")"
          emit index_status "$(status "$INDEX")"
          emit counts "$ok of $planned"

      - name: Post to Slack
        # A no-op run composes a message but does not send it, so the branch
        # stays covered by the compose step's tests either way.
        if: ${{ steps.meta.outputs.post == 'true' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          # The action's default, `errors: false`, discards a Slack API error
          # without logging it, so a rejected post reads as a green step.
          # `true` fails the step with Slack's error as an annotation;
          # continue-on-error above still keeps the job and the run green.
          errors: true
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            text: "${{ steps.meta.outputs.mention }}${{ steps.meta.outputs.header }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "${{ steps.meta.outputs.header }}"
                  emoji: true
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.meta.outputs.detail }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository:*\n`${{ github.repository }}`"
                  - type: "mrkdwn"
                    text: "*Providers:*\n${{ steps.meta.outputs.counts }}"
                  - type: "mrkdwn"
                    text: "*Triggered by:*\n${{ github.actor }}"
                  - type: "mrkdwn"
                    text: "*Workflow run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open run>"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Build:*\n${{ steps.meta.outputs.build_status }}"
                  - type: "mrkdwn"
                    text: "*Index:*\n${{ steps.meta.outputs.index_status }}"
