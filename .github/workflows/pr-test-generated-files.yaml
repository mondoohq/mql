name: Generated Code Test

## Only trigger tests if source is changing
##
## go.mod and go.sum count as source here: the protoc plugins come from the
## `tool` directive, so bumping google.golang.org/protobuf changes what the
## generated files look like. Without them a dependency bump lands green and the
## next push that happens to touch a .go file inherits the failure, which is how
## mondoohq/cnspec#3336 happened.
on:
  # Run on PRs so the arc-runner job can be skipped while the PR is a draft
  # (see the `if` guard below); ready_for_review re-triggers it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.proto"
      - "**.lr"
      - "**.go"
      - "go.mod"
      - "go.sum"
  # Still validate merges to main.
  push:
    branches: [main]
    paths:
      - "**.proto"
      - "**.lr"
      - "**.go"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

env:
  PROTO_VERSION: "21.7"

# On a pull request only the newest commit matters, so runs share a group per
# pull request and supersede each other.
#
# On main every commit is a potential release point, so each gets its own
# group. Sharing one group there does not merely queue the runs: a group
# holds at most one running plus one pending run, and a third arrival cancels
# the pending one. cancel-in-progress being false does not prevent that --
# it only protects the run that already started.
#
# On 2026-09-14 five consecutive commits on main were cancelled that way,
# each before a single job started (total_jobs=0), because merges arrived
# faster than the suite completes. A release was then cut from a stretch of
# main with no test results behind it.
concurrency:
  group: pr-test-generated-files-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Check if there is any dirty change for generated files
  generated-files:
    if: ${{ !github.event.pull_request.draft }} # skip on draft PRs (runs on ready_for_review / push to main)
    runs-on:
      group: arc-runners
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      # We do not permit sudo on self-hosted runners
      - name: "Ensure GCC is installed"
        run: |
          if gcc --version; then
            echo "Good to go";
          else
            echo "Install GCC on the runner.";
          fi

        # Note we do not use apt install -y protobuf-compiler` since it is too old
      - name: Install Protoc
        uses: ./.github/actions/setup-protoc
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.protoc-version }}

      - name: Determine changed providers
        id: changed
        env:
          # Empty on push events (this workflow only triggers on push);
          # scripts/changed-providers.sh falls back to merge-base with origin/main.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/changed-providers.sh

      - name: Check generated files
        env:
          ALL_PROVIDERS: ${{ steps.changed.outputs.all }}
          CHANGED_PROVIDERS: ${{ steps.changed.outputs.providers }}
        run: |
          set -euo pipefail
          protoc --version
          make prep
          # Run all non-provider code generators (these are cheap relative to
          # the per-provider work and may affect non-provider source files).
          make clean/proto llx/generate shared/generate sbom/generate reporter/generate
          # Provider plumbing that every provider relies on.
          make providers/proto providers/config providers/lr
          # Regenerate provider sources. Skip compile — we only need .lr.go,
          # .lr.json, .resources.json to validate against the committed copies.
          if [ "$ALL_PROVIDERS" = "true" ] || [ -z "$CHANGED_PROVIDERS" ]; then
            echo "--> regenerating all providers"
            SKIP_COMPILE=yes make providers/build
          else
            echo "--> regenerating changed providers: $CHANGED_PROVIDERS"
            targets="providers/build/mock providers/build/core"
            for p in $CHANGED_PROVIDERS; do
              targets="$targets providers/build/$p"
            done
            SKIP_COMPILE=yes make $targets
          fi
          git diff --exit-code *.go
          git diff --exit-code providers/**/*.lr.json
          git diff --exit-code providers/**/*.lr.go
          git diff --exit-code providers/**/*.resources.json
