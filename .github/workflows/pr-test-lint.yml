name: Code Test

## Only trigger tests if source is changing
on:
  # Run on PRs so the expensive arc-runner test jobs can be skipped while the PR
  # is a draft (see the per-job `if` guards). `ready_for_review` re-triggers them.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.go"
      - "**.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/pr-test-lint.yml"
      - ".github/workflows/reusable-lint-providers.yml"
      - "**.toml" # run tests when any recording changed
  # Still validate merges to main.
  push:
    branches: [main]
    paths:
      - "**.go"
      - "**.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/pr-test-lint.yml"
      - ".github/workflows/reusable-lint-providers.yml"
      - "**.toml" # run tests when any recording changed

concurrency:
  group: pr-test-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  detect-changed-providers:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.changed.outputs.providers }}
      all: ${{ steps.changed.outputs.all }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine changed providers
        id: changed
        env:
          # Set on pull_request events; empty on push to main, where
          # scripts/changed-providers.sh falls back to merge-base with origin/main.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/changed-providers.sh

  # Check if there is any dirty change for go mod tidy
  go-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      - name: Check go mod
        run: |
          go mod tidy
          git diff --exit-code go.mod

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      - run: make providers/build/core

      - run: make test/generate

      - name: Run protolint
        run: make test/lint/proto

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.10.1
          verify: false

  golangci-lint-providers:
    needs: detect-changed-providers
    uses: ./.github/workflows/reusable-lint-providers.yml
    with:
      only-new-issues: false
      providers: ${{ needs.detect-changed-providers.outputs.all == 'true' && '' || needs.detect-changed-providers.outputs.providers }}

  # Core (non-provider) tests only. Provider packages are tested in the
  # separate go-test-providers job. This always runs: the core scope can be
  # affected by any change, and go-auto-approve depends on it.
  go-test:
    if: ${{ !github.event.pull_request.draft }} # skip on draft PRs (runs on ready_for_review / push to main)
    runs-on:
      group: arc-runners
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      - name: Test mql
        run: make test/go/plain-ci

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure() # run this step even if previous step failed
        with:
          name: test-results
          path: "report.xml"

  # Provider tests. Only the changed providers are built and tested. When a
  # shared dependency changes (detect-changed-providers -> all=true) or the
  # changed list is empty (e.g. pushes to main), every provider is tested.
  go-test-providers:
    needs: detect-changed-providers
    if: ${{ !github.event.pull_request.draft }} # skip on draft PRs (runs on ready_for_review / push to main)
    runs-on:
      group: arc-runners
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      - name: "Set up gcloud CLI"
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1

      - name: Set provider env
        run: echo "PROVIDERS_PATH=${PWD}/.providers" >> $GITHUB_ENV

      - name: Prepare tools and generated code
        run: make prep/tools test/generate

      - name: Test providers
        env:
          ALL: ${{ needs.detect-changed-providers.outputs.all }}
          PROVIDERS: ${{ needs.detect-changed-providers.outputs.providers }}
        run: |
          set -euo pipefail
          if [ "$ALL" = "true" ] || [ -z "$PROVIDERS" ]; then
            echo "=== Testing all providers ==="
            make providers/build
            make providers/test
          else
            echo "=== Testing changed providers: $PROVIDERS ==="
            # Test every changed provider even if one fails, then report all
            # failures at the end (mirrors reusable-lint-providers.yml).
            failed=""
            for p in $PROVIDERS; do
              make "providers/test/$p" || failed="$failed $p"
            done
            if [ -n "$failed" ]; then
              echo "=== Failed providers:$failed ==="
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure() # run this step even if previous step failed
        with:
          name: test-results-providers
          path: "report_*.xml"

  go-test-integration:
    if: ${{ !github.event.pull_request.draft }} # skip on draft PRs (runs on ready_for_review / push to main)
    runs-on:
      group: arc-runners
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      - name: "Set up gcloud CLI"
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1

      - name: Set provider env
        run: echo "PROVIDERS_PATH=${PWD}/.providers" >> $GITHUB_ENV
      - name: Display Provider Path
        run: echo $PROVIDERS_PATH

      - name: Test mql CLI and Providers
        run: make test/integration

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure() # run this step even if previous step failed
        with:
          name: test-results-cli
          path: report.xml

  go-race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      - name: Run race detector on selected packages
        run: make race/go

  go-auto-approve:
    runs-on: ubuntu-latest
    needs: [golangci-lint, golangci-lint-providers, go-test, go-test-providers, go-test-integration, go-mod]
    # For now, we only auto approve and merge provider release PRs created by mondoo-tools.
    # We use github.actor (the authenticated GitHub user who pushed) instead of
    # github.event.commits[0].author.username (the git commit author) because git commit
    # metadata is user-controlled and can be spoofed by anyone via git config.
    # github.actor is set by GitHub's authentication layer and is tamper-proof.
    # Triggers on both pull_request (github.head_ref = the PR's source branch) and
    # push to main (github.head_ref is empty there, so fall back to github.ref_name).
    if: ${{ (startsWith(github.head_ref || github.ref_name, 'version/providers_update_') || startsWith(github.head_ref || github.ref_name, 'version/deps_update_')) && github.actor == 'mondoo-tools' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # figure out the PR for this commit
      - uses: cloudposse-github-actions/get-pr@6db391bee79f3640fca3026877ced2f2b1f2a992 # v3.1.0
        id: pr
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          filterOutClosed: true
          filterOutDraft: true
      # fetch a token for the mondoo-mergebot app
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MONDOO_MERGEBOT_APP_ID }}
          private-key: ${{ secrets.MONDOO_MERGEBOT_APP_PRIVATE_KEY }}
      # automerge using bot token
      - name: Approve and merge a PR
        run: |
          gh pr review ${{ steps.pr.outputs.number }} --approve
          gh pr merge ${{ steps.pr.outputs.number }} --squash
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}

  event_file:
    name: "Store event file"
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Event File
          path: ${{ github.event_path }}
