name: Verify Sequences

on:
  pull_request:
    paths:
      - "docs/adr/*.md"
      # Also run when the check itself changes, so a change to it is verified
      # by the thing it configures rather than merging unexercised.
      - ".github/workflows/verify-sequence.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-sequence:
    name: Verify Sequences
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # mode: diff compares against the base ref, so the full history is
          # needed rather than the default shallow clone.
          fetch-depth: 0

      - name: Check ADR sequence
        uses: mondoohq/verify-sequence@9dca90c3101e79fad4a43c96e99ffc055ba518dc # v0.0.2
        with:
          patterns: |
            docs/adr/*.md
          mode: diff
