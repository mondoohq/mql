name: Windows Tests

on:
  pull_request:
    paths:
      - "providers/os/**"
      # the plugin transport tests pin how go-plugin picks ports on Windows
      - "providers-sdk/v1/plugin/**"
      # system proxy detection calls WinHTTP; its smoke tests only run here
      - "utils/sysproxy/**"
      - ".github/workflows/pr-test-windows.yml"

concurrency:
  group: pr-test-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import environment variables from file
        shell: bash
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      - name: Find packages with Windows-specific tests
        id: find-packages
        shell: pwsh
        run: |
          # Every test file that only builds on Windows: named *_windows_test.go,
          # or carrying a windows build constraint (windows_routes_native_test.go
          # has one but not the name, so a name filter alone never ran it).
          $repoRoot = (Get-Location).Path -replace '\\','/'
          $packages = Get-ChildItem -Path providers/os, providers-sdk/v1/plugin, utils/sysproxy -Recurse -Filter "*_test.go" |
            Where-Object { $_.Name -like "*_windows_test.go" -or (Select-String -Path $_.FullName -Pattern '^//go:build .*(?<![!\w])windows\b' -Quiet) } |
            ForEach-Object {
              $rel = ($_.DirectoryName -replace '\\','/').Replace($repoRoot + '/', '')
              "./$rel/..."
            } |
            Sort-Object -Unique
          if ($packages.Count -eq 0) {
            Write-Output "No Windows-specific test packages found"
            echo "has_tests=false" >> $env:GITHUB_OUTPUT
          } else {
            $pkgList = $packages -join " "
            Write-Output "Found Windows test packages: $pkgList"
            echo "has_tests=true" >> $env:GITHUB_OUTPUT
            echo "packages=$pkgList" >> $env:GITHUB_OUTPUT
          }

      - name: Run Windows-specific tests
        if: steps.find-packages.outputs.has_tests == 'true'
        shell: pwsh
        env:
          WIN_TEST_PACKAGES: ${{ steps.find-packages.outputs.packages }}
        run: |
          [string[]]$packages = ($env:WIN_TEST_PACKAGES -split " ") | Where-Object { $_ -ne '' }
          go test -count=1 -v @packages 2>&1 | Tee-Object -FilePath windows-test-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.find-packages.outputs.has_tests == 'true' && (success() || failure())
        with:
          name: windows-test-output
          path: windows-test-output.txt

  # go vet of the Windows build of the os provider. The lint job runs with the
  # runner's GOOS (linux), so //go:build windows files were never vetted; this
  # job vets them with the analyzers .golangci.yaml enables plus unsafeptr,
  # which catches Win32 structs read at byte offsets instead of through their
  # fields.
  windows-vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import environment variables from file
        run: cat ".github/env" >> $GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "${{ env.golang-version }}"
          check-latest: true
          cache: false

      # The snapshot mock the device tests use is generated, not committed.
      - name: Generate mocks
        run: |
          make prep/tools/mockgen
          go generate ./providers/os/...

      - name: go vet (GOOS=windows)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go vet -structtag -lostcancel -unsafeptr ./providers/os/...
