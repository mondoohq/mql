syntax = "proto3";

package mondoo.sbom.v1;

option go_package = "go.mondoo.com/mql/sbom";

// Status represents the possible states of processing or generation for a
// Bill of Materials (BOM). Each status indicates a different stage or outcome
// in the lifecycle of a BOM.
enum Status {
  // UNSPECIFIED indicates an undefined status. This value is used as a default
  // when the status has not been set or is unknown. It suggests that the SBOM's
  // processing state is currently not available or has not been initialized.
  STATUS_UNSPECIFIED = 0;

  // SUCCEEDED indicates that the BOM was successfully processed or generated
  // without any issues. This status means that all components, packages, and
  // materials listed in the BOM have been accounted for and validated, and the
  // BOM is complete and accurate.
  STATUS_SUCCEEDED = 1;

  // PARTIALLY_SUCCEEDED indicates that the BOM was processed or generated with
  // some minor issues or omissions. While the majority of the SBOM is accurate,
  // there might be a few components or details that could not be  fully
  // validated or included. This status is typically used when the BOM is usable
  // but might require additional review or subsequent updates to ensure
  // completeness.
  STATUS_PARTIALLY_SUCCEEDED = 2;

  // FAILED indicates that the process of generating or processing the SBOM
  // encountered significant issues, resulting in an incomplete or inaccurate
  // document. This status is used when critical components or information
  // are missing, preventing the BOM from being usable or reliable. A failed
  // status typically requires a thorough review and reprocessing of the BOM.
  STATUS_FAILED = 3;

  // STARTED indicates that the SBOM scan was initialized. It is used
  // for tracking progress of a scan over time.
  STATUS_STARTED = 4;
}

// Sbom (Software Bill of Materials) represents a comprehensive inventory of
// software packages. It is a structured list of all software components that
// are part of a given asset, such as a virtual machine or container. The Sbom
// is used to identify known vulnerabilities and other security issues within
// the scanned asset.
message Sbom {
  // Details the tool used to generate the BOM. This includes information about
  // the software or service that created the BOM, such as its name, version,
  // and other relevant metadata.
  Generator generator = 1;

  // Indicates when the BOM was generated or last updated. It is expected to
  // follow the RFC 3339 format. This timestamp is essential for maintaining the
  // relevance of the BOM, as software components can frequently change.
  string timestamp = 2;

  // 'status' is an optional field that denotes the current state or processing
  // status of the BOM. It can indicate whether the BOM generation was
  // successful, partially successful, or failed. This status helps in
  // determining the reliability and completeness of the BOM.
  Status status = 3;

  // Represents the primary asset for which the BOM is created. This could be a
  // virtual machine, a container, an application, or any other logical unit in
  // the IT environment. The asset details the context or scope for which the
  // software components in the BOM are relevant.
  Asset asset = 4;

  // 'packages' is a list of all software packages or components included in the
  // BOM. Each package entry contains detailed information such as the package
  // name, version, and other identifiers. This list forms the core of the BOM,
  // providing a detailed account of the software composition of the asset.
  repeated Package packages = 5;

  // 'error_message' is and optional field that describes the error from a
  // failed scan
  string error_message = 6;

  // 'dependencies' is the package→package dependency graph: for each
  // component, the components it directly depends on, both referenced by
  // Package.bom_ref. Populated for ecosystems whose manifest resolves the
  // dependency tree (npm, Cargo, …); empty for those that do not (e.g. Go
  // go.mod's flat require list). This is the CycloneDX `dependencies` / SPDX
  // `DEPENDS_ON` graph, which lets a consumer reason about which components a
  // given component pulls in rather than just a flat inventory.
  repeated Dependency dependencies = 7;
}

// Dependency is one node of the dependency graph: a component and the
// components it directly depends on, all referenced by Package.bom_ref.
message Dependency {
  // 'ref' is the bom_ref of the dependent component.
  string ref = 1;
  // 'dependency_refs' are the bom_refs of the directly depended-on components.
  repeated string dependency_refs = 2;
}

// Source describes the provider of the BOM data, which in this case is the
// always Mondoo.
message Generator {
  // The vendor name or the organization that provided the BOM.
  string vendor = 1;
  // The name of the product or service this BOM pertains to.
  string name = 2;
  // The version of the product or service.
  string version = 3;
  // The URL of the product or service.
  string url = 4;
}

// ExternalIDType enumerates the different types of external identifiers that
// can be used to reference external resources or entities. Each type
// corresponds to a specific kind of identifier, such as an AWS account number
// or an Amazon Resource Name (ARN).
enum ExternalIDType {
  // EXTERNAL_ID_UNSPECIFIED indicates an undefined or unknown type of external
  // ID. This default value is used when the external ID type has not been set
  // or is not applicable.
  EXTERNAL_ID_TYPE_UNSPECIFIED = 0;

  // EXTERNAL_ID_AWS_ACCOUNT represents an AWS account identifier. This type is
  // used when the external ID refers specifically to an AWS account number,
  // which is a unique identifier for an AWS account.
  EXTERNAL_ID_TYPE_AWS_ACCOUNT = 1;

  // EXTERNAL_ID_AWS_ARN denotes an Amazon Resource Name (ARN), a standardized
  // format used by AWS to uniquely identify resources within the AWS ecosystem.
  // ARNs are used in various AWS services to refer to specific resources like
  // IAM roles, S3 buckets, or EC2 instances.
  EXTERNAL_ID_TYPE_AWS_ARN = 2;

  // EXTERNAL_ID_TYPE_AWS_ORG denotes the organization to which the AWS Account
  // and all subresources belong.
  EXTERNAL_ID_TYPE_AWS_ORG = 3;

  // EXTERNAL_ID_TYPE_AZURE_SUB represents an Azure subscription identifier.
  // This type is used when the external ID refers specifically to an Azure
  // subscription number, which is a unique identifier for an Azure
  // subscription.
  EXTERNAL_ID_TYPE_AZURE_SUB = 4;

  // EXTERNAL_ID_TYPE_AZURE_ID represents a fully qualified Azure resource
  // identifier, a standardized format used by Azure to uniquely identify
  // resources within the Azure ecosystem.
  EXTERNAL_ID_TYPE_AZURE_ID = 5;
}

// ExternalID encapsulates an external identifier and its type. This structure
// is useful for referencing resources or entities that are external to the
// system or application using this data model.
message ExternalID {
  // 'type' specifies the kind of external identifier being used, such as an AWS
  // account number or an ARN. The type provides context to the 'id' field,
  // indicating how the ID should be interpreted and used.
  ExternalIDType type = 1;

  // 'id' is the actual identifier of the external resource. The format and
  // interpretation of this ID depend on the 'type'. For example, it could be a
  // numeric string for AWS account numbers or a structured string for ARNs.
  // This ID is used to uniquely identify or reference an external entity or
  // resource.
  string id = 2;
}

// Asset represents a digital or physical resource in an IT environment. It
// could be software, hardware, or any identifiable entity within the
// infrastructure.
message Asset {
  // 'name' is a human-readable identifier for the asset. This field should
  // contain a descriptive name that easily identifies the asset within the
  // system.
  string name = 3;

  // 'platform_ids' are unique identifiers that represent the asset within
  // various platforms. These IDs follow the MRN format and can point to
  // specific resources within a given platform. Example formats include
  // identifiers for AWS accounts or EC2 instances. Sample platform ids are:
  // - //platformid.api.mondoo.app/runtime/aws/accounts/111222333444
  // - //platformid.api.mondoo.app/runtime/aws/ec2/v1/accounts/111222333444
  repeated string platform_ids = 4;

  // 'external_ids' are a collection of identifiers that link the asset to
  // external systems or resources. Each external ID is associated with a type
  // that specifies the kind of identifier (e.g., AWS account number, ARN).
  repeated ExternalID external_ids = 5;

  // 'platform' provides detailed information about the platform of the asset,
  // such as operating system, architecture, and version.
  Platform platform = 6;

  // 'labels' are key-value pairs used for categorizing or annotating the asset.
  // These labels are sourced from the system that is the asset owner. For
  // example, labels for EC2 instance are populated from the EC2 metadata tags.
  map<string, string> labels = 18;

  // 'trace_id' is used to link the asset to a specific identifier
  // that is passed in by the user. if the user provides no value,
  // this will be empty.
  string trace_id = 19;

  // In case this is a Linux asset, you can specify the different kernels here.
  repeated Kernel kernels = 20;
}

// Platform describes the technical platform or environment of an asset. This
// could be an operating system, a hardware architecture, a cloud resource or
// another defining characteristic of the asset's environment.
message Platform {
  // The technical name of the platform, e.g., "amazonlinux".
  string name = 1;
  // The architecture type, e.g., "x86_64".
  string arch = 3;
  // A human-readable title of the platform, e.g., "Amazon Linux 2".
  string title = 4;
  // Categories or families the platform belongs to, e.g., "linux", "unix".
  // protolint:disable REPEATED_FIELD_NAMES_PLURALIZED
  repeated string family = 5;
  // An optional field indicating the build number of the platform.
  string build = 6;
  // The version of the platform, e.g., "2".
  string version = 7;
  // 'labels' are additional key-value pairs that provide more context or
  // metadata about the platform.
  map<string, string> labels = 22;
  // The Common Platform Enumeration (CPE) for the platform.
  repeated string cpes = 23;
}

// Package details an individual software package or library.
message Package {
  // The name of the package.
  string name = 1;
  // The version of the package.
  string version = 2;
  // The architecture of the package
  string architecture = 3;
  // The Common Platform Enumeration (CPE) name
  repeated string cpes = 4;
  // The Package URL (pURL), a standardized format for defining and locating
  // software package metadata.
  string purl = 5;
  // location on disk
  // Deprecated: use evidence instead
  string location = 6;
  // 'type' indicates the type of package, such as a rpm, dpkg, or gem.
  string type = 7;
  // description of the package
  string description = 20;
  // 'evidence_list' is a collection of evidence that supports the presence of
  // the package in the asset. This evidence could include eg. file paths
  repeated Evidence evidence_list = 21;
  // Package Origin (e.g. other package name, or source of the package)
  string origin = 22;
  // Package Vendor/Publisher
  string vendor = 23;
  // Status of the package
  string status = 24;
  // Optional: Title of the package
  string title = 25;
  // SPDX license expression (or upstream-reported license string).
  // Empty when the backend has no source for it (e.g. Windows registry
  // — DisplayName carries no license field).
  //
  // Deprecated: use 'licenses' (field 31) instead. One string cannot say
  // whether a license was declared by the package or concluded from the files
  // it ships, and those two disagreeing is the case a compliance document
  // exists to surface. It cannot carry more than one license, a confidence, or
  // the file a conclusion was read from either.
  //
  // Still read, and still the only source for most producers. Every renderer
  // falls back to this field when 'licenses' is empty, so a producer that has
  // not adopted the list renders exactly as it did before and nothing breaks on
  // the version that introduces this marker.
  //
  // Note what is NOT enforced: nothing populates this field from 'licenses'. A
  // producer that adopts the list is responsible for continuing to set this
  // scalar to its first declared entry, or consumers still reading the scalar
  // will silently see an empty license where one was determined. That is a
  // convention, not a guarantee the model makes.
  //
  // The deprecation says which field new code should read, not that this one
  // has stopped working. It will not be removed while unmigrated producers
  // remain.
  string license = 26 [deprecated = true];
  // Time the package was installed on this asset, RFC3339 format
  // (e.g. "2024-03-15T00:00:00Z"). Empty when the backend doesn't
  // surface install time (dpkg without log parsing, apk, pacman,
  // macOS).
  string install_date = 27;
  // 'bom_ref' is a stable, document-internal identifier for this component
  // (a CycloneDX bom-ref). Deterministic: the purl when present, else a
  // synthesized id. It is the endpoint the dependency graph
  // (Sbom.dependencies) references, and the value the CycloneDX/SPDX renderers
  // use — so the rendered BOM is reproducible (previously a random UUID was
  // minted per render).
  string bom_ref = 28;
  // 'scope' is the dependency scope: "prod" (production/runtime), "dev"
  // (development/test-only, e.g. an npm devDependency or its closure), or empty
  // when the source does not distinguish. Lets a consumer rank/handle a
  // dev-only component differently from a production one.
  string scope = 29;
  // 'hashes' are the package's declared integrity digests (e.g. an npm
  // dependency's Subresource-Integrity value). Populated for ecosystems whose
  // manifest records them (npm today), empty otherwise. Rendered as CycloneDX
  // `component.hashes` / SPDX package checksums — tamper-evidence.
  repeated Hash hashes = 30;
  // 'licenses' is what is known about this package's licensing, one entry per
  // license, each carrying how it was learned. It supersedes the 'license'
  // scalar above, which cannot express the distinction that matters most: what
  // a package's own manifest *declares* is not always what its shipped files
  // say. A package declaring MIT while shipping an AGPL-3.0-only license file
  // is the case a compliance document must not flatten, and the scalar has no
  // room for both values.
  //
  // The scalar is deprecated in favour of this field. A producer adopting this
  // list should keep the scalar set to its first declared entry so consumers
  // can migrate without a flag day — the renderers fall back to the scalar, but
  // nothing populates it from here.
  repeated License licenses = 31;
  // 'copyright' holds the copyright statements found in the package's license
  // and notice files. Attribution output needs these: no amount of license
  // identification substitutes for knowing who to credit.
  repeated string copyright = 32;
  // 'supplier' is the entity that supplied the package, as SPDX and CycloneDX
  // both model it (a name, optionally with an email in angle brackets).
  string supplier = 33;
  // 'os_provided' says whether the operating system vendor provides the
  // package: true for an application that comes with macOS or Windows and for
  // a package from the distribution's own repositories, false for third-party
  // software (ADR 049). Unset when nothing on the system answered, which is
  // not the same as false: most container images ship without the apt
  // indexes a deb package is matched against.
  optional bool os_provided = 34;
  // 'source' is where the installed build came from. Unset when the scan did
  // not report it.
  PackageSource source = 35;
}

// PackageSource is where an installed package came from (ADR 049).
message PackageSource {
  // 'channel' is how the package reached the system: "os", "vendor-repository",
  // "app-store", "homebrew", "installer", "direct", "snap", "flatpak",
  // "chocolatey" or "unknown".
  string channel = 1;
  // 'name' is the repository, store or installer as the system names it, e.g.
  // the apt release Origin "nginx" or the dnf repository id "docker-ce-stable".
  string name = 2;
  // 'url' is the repository's address, without credentials.
  string url = 3;
}

// License is one license attributed to a package, and how that attribution was
// arrived at.
message License {
  // Exactly one of 'spdx_id', 'expression' and 'name' is set, and which one it
  // is says what kind of value this is. The distinction is not cosmetic:
  // CycloneDX models the three mutually exclusively and rejects a document that
  // puts an expression where an id belongs.
  //
  // 'spdx_id' is a bare SPDX identifier, e.g. "MIT".
  string spdx_id = 1;
  // 'expression' is a full SPDX expression, e.g. "MIT OR Apache-2.0".
  string expression = 2;
  // 'name' is a string that is neither — "BSD-like", "see LICENSE". Carrying it
  // as a name is honest; forcing it into an id would be a claim the source does
  // not support.
  string name = 3;
  // 'acquisition' says whether the package declared this license or it was
  // concluded from the files it ships.
  LicenseAcquisition acquisition = 4;
  // 'confidence' is how sure the producer is, in (0,1], or 0 when no score was
  // attached. A declared license is 1.0 — it is a statement, not a measurement.
  // A license concluded by matching text carries the match's own score, so a
  // consumer can tell a certainty from an inference rather than reading both as
  // the same fact.
  //
  // 0 is the third reading, and it is not the same as 1.0: it means nobody
  // measured this. An importer reading a format that carries no score leaves it
  // there rather than promoting it, so a conclusion that was never scored is
  // never mistaken for one that scored perfectly. Consumers should treat 0 as
  // "unknown" and say nothing about it.
  double confidence = 5;
  // 'location' is the file this license was read from, relative to the scan
  // root — the evidence behind a concluded license. Empty for a declared one,
  // whose source is the manifest already identified by the package, and empty
  // for a concluded one whose source did not record a file. It is a path, not
  // prose: a producer holding a comment about how a conclusion was reached
  // leaves this empty rather than putting the sentence here.
  string location = 6;
}

// LicenseAcquisition is how a license came to be attributed to a package.
enum LicenseAcquisition {
  // The producer did not say.
  LICENSE_ACQUISITION_UNSPECIFIED = 0;
  // The package's own manifest or lockfile states this license.
  LICENSE_ACQUISITION_DECLARED = 1;
  // Read from the license files the package ships, which is the stronger
  // evidence where the two disagree: the shipped text is the grant.
  LICENSE_ACQUISITION_CONCLUDED = 2;
}

// Hash is one integrity digest of a package: an algorithm label and its
// hex-encoded value.
message Hash {
  // 'alg' is the hash algorithm, CycloneDX spelling (e.g. "SHA-512", "SHA-1").
  string alg = 1;
  // 'value' is the lower-case hex-encoded digest.
  string value = 2;
}

enum EvidenceType {
  EVIDENCE_TYPE_UNSPECIFIED = 0;
  EVIDENCE_TYPE_FILE = 1;
}

message Evidence {
  // 'type' indicates the type of evidence, such as a file path.
  EvidenceType type = 1;
  // 'value' is the actual evidence that supports the presence of the package in
  // the asset. The format and interpretation of this value depend on the
  // 'type'. For example, it could be a file path for file evidence.
  string value = 2;
}

// Kernel contains information about a OS kernel
message Kernel {
  // The name of the kernel.
  string name = 1;
  // The version of the kernel.
  string version = 2;
  // Is the kernel currently running or not
  bool running = 3;
}
