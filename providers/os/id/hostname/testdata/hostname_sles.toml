# Captured from a stock SUSE Linux Enterprise Server 15 SP7 EC2 instance. Its
# hostname resolves nowhere, so `hostname -f` fails, and SUSE's /etc/hosts maps
# ::1 to "localhost ipv6-localhost ipv6-loopback".
[commands."hostname -f"]
stderr = "hostname: Name or service not known"
exit_status = 1

[commands."getent hosts 127.0.0.1"]
stdout = "127.0.0.1       localhost"

[commands."getent hosts ::1"]
stdout = "::1             localhost ipv6-localhost ipv6-loopback"

[commands."hostname"]
stdout = "ip-172-17-2-134"

[commands."uname -s"]
stdout = "Linux"

[commands."uname -m"]
stdout = "x86_64"

[commands."uname -r"]
stdout = "6.4.0-150700.53.81-default"

[files."/etc/os-release"]
content = """
NAME="SLES"
VERSION="15-SP7"
VERSION_ID="15.7"
PRETTY_NAME="SUSE Linux Enterprise Server 15 SP7"
ID="sles"
ID_LIKE="suse"
ANSI_COLOR="0;32"
CPE_NAME="cpe:/o:suse:sles:15:sp7"
DOCUMENTATION_URL="https://documentation.suse.com/"
"""

[files."/etc/hosts"]
content = """
127.0.0.1	localhost
::1             localhost ipv6-localhost ipv6-loopback
fe00::0         ipv6-localnet
ff00::0         ipv6-mcastprefix
ff02::1         ipv6-allnodes
ff02::2         ipv6-allrouters
ff02::3         ipv6-allhosts
"""
