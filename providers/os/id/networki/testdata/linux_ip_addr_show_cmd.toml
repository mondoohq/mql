[commands."uname -s"]
stdout = "Linux"

[commands."uname -m"]
stdout = "x86_64"

[commands."uname -r"]
stdout = "4.9.125-linuxkit"

[commands."ip addr show"]
stdout = """
1: lo: <LOOPBACK,UP,LOWER_UP> mtu 65536 qdisc noqueue state UNKNOWN group default qlen 1000
    link/loopback 00:00:00:00:00:00 brd 00:00:00:00:00:00
    inet 127.0.0.1/8 scope host lo
       valid_lft forever preferred_lft forever
    inet6 ::1/128 scope host noprefixroute
       valid_lft forever preferred_lft forever
2: enX0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 9001 qdisc fq_codel state UP group default qlen 1000
    link/ether 0a:ff:de:6b:e3:19 brd ff:ff:ff:ff:ff:ff
    altname eni-087a980ef8e9331bc
    altname device-number-0.0
    inet 172.31.24.71/20 metric 512 brd 172.31.31.255 scope global dynamic enX0
       valid_lft 3284sec preferred_lft 3284sec
    inet6 fe80::8ff:deff:fe6b:e319/64 scope link proto kernel_ll
       valid_lft forever preferred_lft forever
"""

[commands."ip route show"]
stdout = """
default via 172.31.16.1 dev enX0 proto dhcp src 172.31.24.71 metric 512
172.31.0.2 via 172.31.16.1 dev enX0 proto dhcp src 172.31.24.71 metric 512
172.31.16.0/20 dev enX0 proto kernel scope link src 172.31.24.71 metric 512
172.31.16.1 dev enX0 proto dhcp scope link src 172.31.24.71 metric 512
"""

[commands."ip -6 route show"]
stdout = """
fe80::/64 dev enX0 proto kernel metric 256 pref medium
"""

# The sysfs facts a real host carries alongside `ip addr`. Whether an
# interface is virtual is not in the command's output, so it is read from
# here; enX0 is an ENA NIC and has a device link, lo is synthesized by the
# kernel and has none. Shape verified against sysfs on real systems, where a
# virtio NIC resolves under /sys/devices/platform and lo, a container veth,
# docker0, bond0 and dummy0 resolve under /sys/devices/virtual with no device
# link.
[files."/sys/class/net"]
stat.isdir = true

[files."/sys/class/net/enX0"]
stat.isdir = false
[files."/sys/class/net/enX0/ifindex"]
content = "2"
[files."/sys/class/net/enX0/address"]
content = "0a:ff:de:6b:e3:19"
[files."/sys/class/net/enX0/device"]
stat.isdir = true

[files."/sys/class/net/lo"]
stat.isdir = false
[files."/sys/class/net/lo/ifindex"]
content = "1"
[files."/sys/class/net/lo/address"]
content = "00:00:00:00:00:00"

# The bonding driver's control file sits here too, and is not an interface.
[files."/sys/class/net/bonding_masters"]
content = ""
