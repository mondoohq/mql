# Captured on Oracle Solaris 11.4.86 (OCI) as an unprivileged user, with an
# etherstub, a vnic on it carrying two addresses (vnic0 and the logical
# interface vnic0:1), and an IPv6 link-local address on net0.

[commands."ifconfig -a"]
stdout = """
lo0: flags=2001000849<UP,LOOPBACK,RUNNING,MULTICAST,IPv4,VIRTUAL> mtu 8232 index 1
	inet 127.0.0.1 netmask ff000000 
net0: flags=100001004843<UP,BROADCAST,RUNNING,MULTICAST,DHCP,IPv4,PHYSRUNNING> mtu 9000 index 2
	inet 10.77.1.190 netmask ffffff00 broadcast 10.77.1.255
vnic0: flags=100001000843<UP,BROADCAST,RUNNING,MULTICAST,IPv4,PHYSRUNNING> mtu 9000 index 3
	inet 192.168.77.5 netmask ffffff00 broadcast 192.168.77.255
vnic0:1: flags=100001000843<UP,BROADCAST,RUNNING,MULTICAST,IPv4,PHYSRUNNING> mtu 9000 index 3
	inet 192.168.77.6 netmask ffffff00 broadcast 192.168.77.255
lo0: flags=2002000849<UP,LOOPBACK,RUNNING,MULTICAST,IPv6,VIRTUAL> mtu 8252 index 1
	inet6 ::1/128 
net0: flags=120002000841<UP,RUNNING,MULTICAST,IPv6,PHYSRUNNING> mtu 9000 index 2
	inet6 fe80::17ff:fe04:b9e2/10 
vnic0: flags=120002000840<RUNNING,MULTICAST,IPv6,PHYSRUNNING> mtu 9000 index 3
	inet6 ::/0 
"""

[commands."dladm show-linkprop -c -o link,value -p mac-address"]
stdout = """
net0:2\\:0\\:17\\:4\\:b9\\:e2
vnic0:2\\:8\\:20\\:f5\\:36\\:67
"""

[commands."dladm show-link -p -o link,class"]
stdout = """
net0:phys
stub0:etherstub
vnic0:vnic
"""

