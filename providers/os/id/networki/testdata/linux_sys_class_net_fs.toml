content = "0a:ff:de:6b:e3:19"
[files."/sys/class/net/enX0/operstate"]
content = "up"
[files."/sys/class/net/enX0/mtu"]
content = "9001"
[files."/sys/class/net/enX0/flags"]
content = "0x1003"
[files."/sys/class/net/enX0/device/devtype"]
content = "vif"

[files."/sys/class/net/lo"]
stat.isdir = true
