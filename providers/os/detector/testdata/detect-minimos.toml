# Captured from reg.mini.dev/nginx:latest, cross-checked against
# reg.mini.dev/busybox:latest-dev. Both carry identical os-release content.
#
# MinimOS sets no ID_LIKE, so nothing infers a lineage for it, and VERSION_ID is
# a date stamp rather than a dotted version.
#
# Like Chainguard OS and BellSoft Hardened Containers, the images ship an apk
# database but no apk binary, so /etc/os-release is the only evidence detection
# has and there is no /etc/alpine-release for alpine's fallback to find.
[commands."uname -s"]
stdout = "Linux"

[commands."uname -m"]
stdout = "x86_64"

[commands."uname -r"]
stdout = "6.6.12-linuxkit"

[files."/etc/os-release"]
content = """
ID=minimos
NAME="MinimOS"
PRETTY_NAME="MinimOS"
VERSION_ID="20241031"
HOME_URL="https://minimus.io"
BUG_REPORT_URL="https://support.minimus.io"
"""

[files."/lib/apk/db/installed"]
content = """
C:Q1aVpkIgfxaDOtQ1FjR8LVw2KzRIU=
P:ca-certificates-bundle
V:20241010-r0
A:x86_64
S:120886
I:249856
T:Pre generated bundle of Mozilla certificates
U:https://www.mozilla.org/en-US/about/governance/policies/security-group/certs/
L:MPL-2.0 AND MIT

"""
