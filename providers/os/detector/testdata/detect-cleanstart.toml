# Captured from docker.io/cleanstart/busybox:latest, cross-checked against the
# rclone, glibc, nginx, python, bash, curl, git and node images. All carry
# identical os-release content.
#
# CleanStart OS sets no ID_LIKE, so nothing infers a lineage for it, and
# VERSION_ID is a date stamp rather than a dotted version.
#
# The images are glibc-based and ship an apk database but no apk binary, so
# /etc/os-release is the only evidence detection has and there is no
# /etc/alpine-release for alpine's fallback to find.
[commands."uname -s"]
stdout = "Linux"

[commands."uname -m"]
stdout = "x86_64"

[files."/etc/os-release"]
content = """
NAME="CleanStart"
ID=cleanstart
VERSION_ID=20241216
PRETTY_NAME="CleanStart"
HOME_URL="https://cleanstart.com"
BUG_REPORT_URL="https://cleanstart.com"
"""

[files."/lib/apk/db/installed"]
content = """
