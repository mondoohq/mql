# sweep configuration
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log
  logRotate: reopen
  verbosity: 1
  quiet: false
storage:
  dbPath: /var/lib/mongo
  directoryPerDB: false
  engine: wiredTiger
processManagement:
  fork: false
  pidFilePath: /var/run/mongodb/mongod.pid
  timeZoneInfo: /usr/share/zoneinfo
net:
  port: 27017
  bindIpAll: true
  maxIncomingConnections: 2000
  ipv6: false
  unixDomainSocket:
    enabled: true
    pathPrefix: /tmp
    filePermissions: 0700
security:
  authorization: disabled
  keyFile: /etc/mongod-sweep/keyfile
  clusterAuthMode: keyFile
setParameter:
  authenticationMechanisms: SCRAM-SHA-256
  scramIterationCount: 12000
  opensslCipherConfig: 'HIGH:!EXPORT:!aNULL@STRENGTH'
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 250
replication:
  replSetName: rs-sweep
  oplogSizeMB: 512
sharding:
  clusterRole: shardsvr
