# system_profiler omits every bundle on a cryptex. Tips is not really a
# cryptex app; it stands in for a bundle system_profiler does report through
# its /Applications symlink, which must not be listed twice.
[commands."system_profiler SPApplicationsDataType -xml"]
stdout = """<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<array>
	<dict>
		<key>_items</key>
		<array>
			<dict>
				<key>_name</key>
				<string>Finder</string>
				<key>obtained_from</key>
				<string>apple</string>
				<key>path</key>
				<string>/System/Library/CoreServices/Finder.app</string>
				<key>version</key>
				<string>27.0</string>
			</dict>
			<dict>
				<key>_name</key>
				<string>Tips</string>
				<key>obtained_from</key>
				<string>apple</string>
				<key>path</key>
				<string>/Applications/Tips.app</string>
				<key>version</key>
				<string>27.0</string>
			</dict>
		</array>
		<key>_dataType</key>
		<string>SPApplicationsDataType</string>
	</dict>
</array>
</plist>
"""

