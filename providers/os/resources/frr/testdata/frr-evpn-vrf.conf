! EVPN fabric node with tenant VRFs, as rendered into a Host Based
! Networking container. The container mounts this file at /etc/frr/frr.conf.
frr version 8.5.4
frr defaults traditional
hostname worker-01
log file /var/log/frr/frr.log
log stdout informational
!
vrf cluster
 vni 5000
 ip route 10.100.0.0/16 blackhole
exit-vrf
!
vrf vr.mgmt
 vni 5001
exit-vrf
!
vrf t-blue
 vni 5010
 ip route 192.168.10.0/24 blackhole
exit-vrf
!
vrf t-green
 vni 5020
exit-vrf
!
interface hbn
 pbr-policy hbn
exit
!
interface lo
 ip address 192.0.2.30/32
exit
!
router bgp 65100
 bgp router-id 192.0.2.30
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 neighbor swp1 interface remote-as 65000
 neighbor swp1 timers 3 9
 neighbor swp2 interface remote-as 65000
 neighbor swp2 timers 3 9
 !
 address-family ipv4 unicast
  network 192.0.2.30/32
  neighbor swp1 activate
  neighbor swp1 allowas-in
  neighbor swp1 route-map TAG-FABRIC-IN in
  neighbor swp1 route-map DENY-TAG-FABRIC-OUT out
  neighbor swp2 activate
  neighbor swp2 allowas-in
  neighbor swp2 route-map TAG-FABRIC-IN in
  neighbor swp2 route-map DENY-TAG-FABRIC-OUT out
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor swp1 activate
  neighbor swp2 activate
  advertise-all-vni
  vni 4001
   route-target import 65100:4001
   route-target export 65100:4001
  exit-vni
 exit-address-family
exit
!
router bgp 65100 vrf cluster
 bgp router-id 192.0.2.30
 no bgp default ipv4-unicast
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
  redistribute kernel
  import vrf vr.mgmt
  import vrf route-map rm_cluster_import
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast route-map rm_export_local
  advertise ipv6 unicast route-map rm_export_local
  route-target import 65100:5000
  route-target export 65100:5000
 exit-address-family
exit
!
router bgp 65100 vrf vr.mgmt
 bgp router-id 192.0.2.30
 no bgp default ipv4-unicast
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
  import vrf cluster
  import vrf route-map rm_vr.mgmt_import
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast route-map rm_export_local
  route-target import 65100:5001
  route-target export 65100:5001
 exit-address-family
exit
!
router bgp 65100 vrf t-blue
 bgp router-id 192.0.2.30
 no bgp default ipv4-unicast
 neighbor 203.0.113.5 remote-as 65200
 neighbor 203.0.113.5 timers 3 9
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
  redistribute kernel
  neighbor 203.0.113.5 activate
  neighbor 203.0.113.5 maximum-prefix 100
  neighbor 203.0.113.5 route-map 203-0-113-5-ipv4-in in
  neighbor 203.0.113.5 route-map 203-0-113-5-ipv4-out out
  import vrf route-map rm_t-blue_import
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast route-map rm_export_local
  route-target import 65100:5010
  route-target export 65100:5010
 exit-address-family
exit
!
router bgp 65100 vrf t-green
 bgp router-id 192.0.2.30
 no bgp default ipv4-unicast
 neighbor 203.0.113.9 remote-as 65300
 !
 address-family ipv4 unicast
  redistribute connected
  redistribute static
  neighbor 203.0.113.9 activate
  import vrf route-map rm_t-green_import
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast route-map rm_export_local
  route-target import 65100:5010
  route-target import 65100:5020
  route-target export 65100:5020
 exit-address-family
exit
!
ip prefix-list pl_export_base seq 5 permit 10.0.0.0/8 le 32
ip prefix-list pl_link_local seq 5 permit 169.254.0.0/16 le 32
ip prefix-list ANY seq 5 permit any
ip prefix-list DEFAULT seq 5 permit 0.0.0.0/0
!
bgp community-list standard cm-received-fabric permit 65100:200
!
route-map TAG-FABRIC-IN permit 10
 set community 65100:200 additive
 set local-preference 100
exit
!
route-map DENY-TAG-FABRIC-OUT deny 10
 match community cm-received-fabric
exit
route-map DENY-TAG-FABRIC-OUT permit 20
exit
!
route-map rm_cluster_import permit 1
 match ip address ANY
 set ipv4 vpn next-hop 0.0.0.0
 on-match next
exit
route-map rm_cluster_import deny 65534
 match ip address prefix-list DEFAULT
 match source-vrf vr.mgmt
exit
route-map rm_cluster_import permit 65535
 match source-vrf vr.mgmt
exit
!
route-map rm_t-blue_import permit 10
 match source-vrf cluster
 call rm_t-blue_import_cluster
end
!
route-map rm_export_local deny 10
 match community cm-received-fabric
exit
route-map rm_export_local permit 20
exit
!
pbr-map hbn seq 1
 match src-ip 10.100.0.0/16
 set nexthop vr.mgmt nexthop-vrf vr.mgmt
exit
!
bfd
exit
!
