! Policy objects of a fabric node: the lists a route map names, and the
! static routes that leak between VRFs.
frr version 10.3.1
frr defaults datacenter
hostname worker-02
!
vrf cluster
 vni 5000
 ip route 10.100.0.0/16 blackhole
 ip route 10.200.0.0/16 vr.mgmt nexthop-vrf vr.mgmt
exit-vrf
!
ip route 0.0.0.0/0 192.0.2.1 200
ip route 10.50.0.0/16 192.0.2.9 vrf vr.mgmt table 1006 tag 400
ip route 172.16.0.0/12 eth0
ipv6 route 2001:db8::/32 blackhole
ip route 192.168.99.0/24 Null0
!
ip prefix-list pl_export_base seq 5 permit 10.0.0.0/8 le 32
ipv6 prefix-list pl_export_base6 seq 5 permit 2001:db8::/32 le 64
!
access-list acl_mgmt seq 5 permit 10.10.0.0/16
access-list acl_mgmt seq 10 deny any
ipv6 access-list acl_mgmt6 permit 2001:db8:1::/48
!
bgp community-list standard cm-received-fabric permit 65100:200
bgp community-list standard cm-received-fabric permit 65100:201
bgp community-list expanded cm-any-tenant deny _65[0-9]*_
bgp large-community-list standard lcm-tenant permit 65100:1:2
bgp extcommunity-list standard ecm-tenant-rt permit rt 65100:5000
ip community-list standard cm-legacy permit 65100:100
!
bgp as-path access-list ap-transit permit ^65000_
bgp as-path access-list ap-transit deny .*
!
route-map rm_tenant_in permit 10
 match ip address prefix-list pl_export_base
 match community cm-received-fabric
 match source-vrf cluster
 match peer 203.0.113.5
 set local-preference 50
 set community 65100:300 additive
 set metric +10
 on-match next
exit
route-map rm_tenant_in permit 20
 match ipv6 address prefix-list pl_export_base6
 match large-community lcm-tenant
 match extcommunity ecm-tenant-rt
 match as-path ap-transit
 match evpn route-type 2
 match evpn vni 4001
 match tag 400
 set comm-list cm-received-fabric delete
 set as-path prepend 65100 65100
 set ipv6 next-hop global 2001:db8::1
 set large-community 65100:1:3
 set extcommunity rt 65100:5010
 set weight 100
 set origin igp
 set tag 401
 set distance 20
 set atomic-aggregate
exit
route-map rm_tenant_in deny 65535
 match ip address acl_mgmt
exit
!
route-map rm_cluster_import permit 1
 match ip address ANY
 set ipv4 vpn next-hop 0.0.0.0
 set community none
 call rm_tenant_in
exit
!
