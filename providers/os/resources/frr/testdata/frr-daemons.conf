! A node that runs the interior gateway protocols next to BGP, with the
! BFD sessions and the policy routing an HBN deployment adds.
frr version 10.3.1
frr defaults datacenter
hostname border-01
log file /var/log/frr/frr.log informational
log syslog warnings
log stdout
log commands
password 8 encrypted-secret
enable password 8 other-secret
agentx
service integrated-vtysh-config
service advanced-vty
username admin nopassword
username operator privilege 15
!
interface swp1
 description underlay to spine1
 ip address 192.0.2.30/31
 ip ospf area 0.0.0.0
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 secret
 ip ospf network point-to-point
 ip ospf hello-interval 3
 ip ospf dead-interval 9
 ip ospf cost 100
 ip ospf priority 0
 bfd
exit
!
interface swp2
 ip router isis FABRIC
 isis circuit-type level-2-only
 isis network point-to-point
 isis password md5 fabric-secret
 isis authentication md5 keychain-1
 ip pim
 ip igmp
exit
!
interface lo
 ip address 192.0.2.30/32
 ip ospf area 0.0.0.0
 ip ospf passive
exit
!
router ospf
 ospf router-id 192.0.2.30
 log-adjacency-changes
 passive-interface default
 no passive-interface swp1
 area 0.0.0.0 authentication message-digest
 area 0.0.0.1 stub no-summary
 area 0.0.0.1 range 10.10.0.0/16
 area 0.0.0.2 nssa
 area 0.0.0.2 filter-list prefix pl_export_base in
 area 0.0.0.3 virtual-link 192.0.2.31
 network 192.0.2.30/32 area 0.0.0.0
 network 10.10.0.0/16 area 0.0.0.1
 redistribute connected
 redistribute static route-map rm_export_local
 default-information originate
 max-metric router-lsa on-startup 300
exit
!
router ospf6 vrf cluster
 ospf6 router-id 192.0.2.30
 log-adjacency-changes
 redistribute connected
exit
!
router isis FABRIC
 net 49.0001.1920.0200.0030.00
 is-type level-2-only
 metric-style wide
 area-password md5 area-secret
 domain-password clear domain-secret
 log-adjacency-changes
 redistribute ipv4 connected level-2
exit
!
bfd
 profile fabric
  detect-multiplier 3
  transmit-interval 150
  receive-interval 150
  echo-mode
  echo-interval 50
 exit
 peer 192.0.2.31 interface swp1
  detect-multiplier 3
  transmit-interval 300
  receive-interval 300
  minimum-ttl 254
 exit
 peer 203.0.113.9 multihop local-address 192.0.2.30 vrf cluster
  profile fabric
  passive-mode
  shutdown
 exit
exit
!
pbr-map hbn seq 1
 match src-ip 10.100.0.0/16
 match dst-port 443
 match ip-protocol tcp
 set nexthop vr.mgmt nexthop-vrf vr.mgmt
exit
pbr-map hbn seq 2
 match dst-ip 10.200.0.0/16
 set table 1005
exit
!
segment-routing
 mpls
 srv6
  locators
   locator MAIN
    prefix 2001:db8:aaaa::/48 block-len 40 node-len 24
   exit
  exit
 exit
exit
!
