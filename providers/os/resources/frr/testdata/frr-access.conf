! The blocks that decide who reaches the router and what it trusts.
frr version 10.3.1
hostname border-02
!
key chain FABRIC
 key 1
  key-string fabric-secret
  cryptographic-algorithm hmac-sha-256
  send-lifetime 00:00:00 Jan 1 2026 23:59:59 Dec 31 2026
  accept-lifetime 00:00:00 Jan 1 2026 23:59:59 Dec 31 2026
 exit
 key 2
  key-string next-secret
  cryptographic-algorithm hmac-sha-256
 exit
exit
!
key chain LEGACY
 key 1
  key-string old-secret
 exit
exit
!
line vty
 access-class acl_mgmt
 ipv6 access-class acl_mgmt6
 exec-timeout 10 0
exit
!
rpki
 rpki polling_period 300
 rpki expire_interval 7200
 rpki retry_interval 600
 rpki cache 192.0.2.100 3323 preference 1
 rpki cache ssh 192.0.2.101 22 rpki-user preference 2
exit
!
access-list acl_mgmt seq 5 permit 10.10.0.0/16
!
router bgp 65100
 bgp router-id 192.0.2.40
 neighbor swp1 interface remote-as 65000
 !
 address-family ipv4 unicast
  neighbor swp1 activate
 exit-address-family
exit
!
