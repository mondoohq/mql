! Plain BGP node, FRR running natively on the host, config in /etc/frr.
frr version 10.3.1
frr defaults datacenter
hostname leaf1
log syslog informational
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
interface lo
 ip address 192.0.2.10/32
exit
!
interface eth-dcgw1
 description uplink to dcgw1
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
router bgp 65500
 bgp router-id 192.0.2.10
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 bgp bestpath as-path multipath-relax
 !
 neighbor eth-dcgw1 interface remote-as 64497
 neighbor eth-dcgw2 interface remote-as 64497
 !
 neighbor server peer-group
 neighbor server remote-as 65501
 neighbor server bfd
 neighbor server timers 3 9
 neighbor server password s3cret
 !
 neighbor eth-srv1 interface peer-group server
 neighbor 198.51.100.7 remote-as 65502
 neighbor 198.51.100.7 description transit peer
 neighbor 198.51.100.7 ttl-security hops 2
 !
 address-family ipv4 unicast
  network 192.0.2.10/32
  neighbor eth-dcgw1 activate
  neighbor eth-dcgw1 prefix-list pl_fabric_in in
  neighbor eth-dcgw1 route-map rm_fabric_out out
  neighbor eth-dcgw1 maximum-prefix 1000
  neighbor eth-dcgw2 activate
  neighbor eth-dcgw2 prefix-list pl_fabric_in in
  neighbor eth-dcgw2 route-map rm_fabric_out out
  neighbor server activate
  neighbor server soft-reconfiguration inbound
  neighbor 198.51.100.7 activate
 exit-address-family
 !
 address-family ipv6 unicast
  neighbor eth-dcgw1 activate
  neighbor eth-dcgw1 prefix-list pl_fabric_in6 in
 exit-address-family
exit
!
ip prefix-list pl_fabric_in seq 5 permit 10.0.0.0/8 le 24
ip prefix-list pl_fabric_in seq 10 deny 0.0.0.0/0
ipv6 prefix-list pl_fabric_in6 seq 5 permit 2001:db8::/32 le 64
!
route-map rm_fabric_out permit 10
 match ip address prefix-list pl_fabric_in
 set community 65500:100 additive
exit
route-map rm_fabric_out deny 20
exit
!
bfd
 profile fabric
  detect-multiplier 3
  transmit-interval 300
 exit
exit
!
