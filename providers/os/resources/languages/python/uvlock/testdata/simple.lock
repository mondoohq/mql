version = 1
requires-python = ">=3.11"

[[package]]
name = "my-project"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "django" },
    { name = "requests" },
]

[[package]]
name = "django"
version = "4.2.7"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "requests"
version = "2.31.0"
source = { registry = "https://pypi.org/simple" }
dependencies = [
    { name = "certifi" },
    { name = "urllib3" },
    { name = "not-locked" },
    { name = "zope.interface" },
]

[package.optional-dependencies]
socks = [
    { name = "charset_normalizer" },
]

[[package]]
name = "certifi"
version = "2024.2.2"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "urllib3"
version = "2.1.0"
source = { registry = "https://pypi.org/simple" }

[[package]]
name = "charset-normalizer"
version = "3.3.2"
source = { registry = "https://pypi.org/simple" }

# Spelled the way the project publishes it. Neither this nor the reference above
# is PEP 503 normalized, and they are not normalized the SAME way, so resolving
# the edge needs BOTH the index and the lookup normalized.
[[package]]
name = "Zope_Interface"
version = "6.1"
source = { registry = "https://pypi.org/simple" }
