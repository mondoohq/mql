[metadata]
lock-version = "4.5.0"
strategy = ["cross_platform"]
content-hash = "sha256:abc123"

[[package]]
name = "django"
version = "4.2.7"
groups = ["default"]

[[package]]
name = "requests"
version = "2.31.0"
groups = ["default"]
dependencies = [
    "certifi>=2017.4.17",
    "charset_normalizer<4,>=2",
    "not-locked>=1.0",
    "zope.interface>=5.0",
]

[[package]]
name = "pytest"
version = "7.4.3"
groups = ["dev"]

[[package]]
name = "certifi"
version = "2024.2.2"
groups = ["default"]

[[package]]
name = "charset-normalizer"
version = "3.3.2"
groups = ["default"]

# Spelled the way the project publishes it. Neither this nor the requirement
# above is PEP 503 normalized, and they are not normalized the SAME way, so
# resolving the edge needs BOTH the index and the lookup normalized.
[[package]]
name = "Zope_Interface"
version = "6.1"
groups = ["default"]
