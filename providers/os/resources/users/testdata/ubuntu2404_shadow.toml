ubuntu:x:1000:1000:Ubuntu:/home/ubuntu:/bin/bash
mqlt_bash:x:2001:2001::/home/mqlt_bash:/bin/bash
mqlt_locked:x:2002:2002::/home/mqlt_locked:/bin/bash
mqlt_nopw:x:2003:2003::/home/mqlt_nopw:/bin/bash
mqlt_expire:x:2008:2008::/home/mqlt_expire:/bin/bash
ldapuser:x:5001:5001::/home/ldapuser:/bin/bash"""

