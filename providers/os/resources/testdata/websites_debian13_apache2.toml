# after `a2enmod ssl proxy proxy_http` and `a2ensite default-ssl`. The
# stock 000-default and default-ssl virtual hosts set no ServerName, and
# neither does apache2.conf. ports.conf listens on 443 only inside
# <IfModule ssl_module>. Only the files that decide the sites are kept:
# apache2.conf, ports.conf, envvars, the LoadModule lines of mods-enabled,
# and sites-enabled.

