version = 2

[plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
  endpoint = ["https://mirror.example.com", "https://registry-1.docker.io"]

[plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry.local:5000"]
  endpoint = ["http://registry.local:5000"]

[plugins."io.containerd.grpc.v1.cri".registry.configs."mirror.example.com".tls]
  ca_file = "/etc/containerd/mirror-ca.crt"

[plugins."io.containerd.grpc.v1.cri".registry.configs."registry.local:5000".tls]
  insecure_skip_verify = true

[plugins."io.containerd.grpc.v1.cri".registry.configs."quay.io".tls]
  insecure_skip_verify = true

[plugins."io.containerd.grpc.v1.cri".registry.configs."quay.io".auth]
  username = "robot"
  password = "example"
