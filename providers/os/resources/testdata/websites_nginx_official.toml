# Measured: the nginx:1.29 container image (nginx 1.29.8), 2026-10-30.
# nginx.conf includes conf.d/*.conf, and conf.d/default.conf is one server
# block on both address families named localhost, without default_server,
# serving its content from the root of `location /`. mime.types is left out.

[files."/etc"]
path = "/etc"
[files."/etc".stat]
isdir = true
mode = 16877

[files."/etc/nginx"]
path = "/etc/nginx"
[files."/etc/nginx".stat]
isdir = true
mode = 16877

[files."/etc/nginx/conf.d"]
path = "/etc/nginx/conf.d"
[files."/etc/nginx/conf.d".stat]
isdir = true
mode = 16877

[files."/etc/nginx/nginx.conf"]
path = "/etc/nginx/nginx.conf"
content = '''

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
'''
[files."/etc/nginx/nginx.conf".stat]
mode = 33188

[files."/etc/nginx/conf.d/default.conf"]
path = "/etc/nginx/conf.d/default.conf"
content = '''
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
