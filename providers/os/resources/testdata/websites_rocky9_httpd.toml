# Measured: rockylinux:9 with the httpd and mod_ssl packages (Apache
# 2.4.62), 2026-10-30. httpd.conf has no virtual host and listens on 80, so
# the main server answers there. ssl.conf listens on 443 with the
# <VirtualHost _default_:443>, whose DocumentRoot and ServerName are
# commented out. Only the files that decide the sites are kept: httpd.conf,
# the LoadModule lines of conf.modules.d, and conf.d/ssl.conf.

[files."/etc"]
path = "/etc"
[files."/etc".stat]
isdir = true
mode = 16877

[files."/etc/httpd"]
path = "/etc/httpd"
[files."/etc/httpd".stat]
isdir = true
mode = 16877

[files."/etc/httpd/conf"]
