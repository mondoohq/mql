# An administrator's drop-in, /etc/containers/containers.conf.d/50-hardening.conf
[containers]
default_capabilities = ["CAP_AUDIT_WRITE", {append = true}]
default_sysctls = []
seccomp_profile = "/etc/containers/seccomp-strict.json"
pids_limit = 0
env = ["https_proxy=http://proxy.example:3128"]

[secrets]
driver = "shell"

[secrets.opts]
lookup = "vault-lookup"
