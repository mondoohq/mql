short-name-mode = "disabled"

[[registry]]
prefix = "docker.io"
location = "docker.io"

[[registry.mirror]]
location = "mirror.example.com/dockerhub/"
pull-from-mirror = "digest-only"

[[registry.mirror]]
location = "cache.example.local:5000"
insecure = true

[[registry]]
location = "registry.example.local:5000"
insecure = true

[[registry]]
prefix = "*.untrusted.example"
blocked = true

[aliases]
"fedora" = ""
"busybox" = "quay.io/example/busybox"
