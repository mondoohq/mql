path = "/etc/mysql"
[files."/etc/mysql".stat]
isdir = true
mode = 16877

[files."/etc/mysql/conf.d"]
path = "/etc/mysql/conf.d"
[files."/etc/mysql/conf.d".stat]
isdir = true
mode = 16877

[files."/etc/mysql/mariadb.conf.d"]
path = "/etc/mysql/mariadb.conf.d"
[files."/etc/mysql/mariadb.conf.d".stat]
isdir = true
mode = 16877

[files."/etc/mysql/mariadb.conf.d/99-enable-encryption.cnf.preset"]
path = "/etc/mysql/mariadb.conf.d/99-enable-encryption.cnf.preset"
[files."/etc/mysql/mariadb.conf.d/99-enable-encryption.cnf.preset".stat]
isdir = true
mode = 16877

[files."/usr"]
path = "/usr"
[files."/usr".stat]
