
# The mariadb:11.4 image. There is no /usr/sbin/mysqld and no [mysqld] group
# anywhere: the server is configured under [mariadbd].

[files."/etc"]
path = "/etc"
[files."/etc".stat]
isdir = true
mode = 16877

