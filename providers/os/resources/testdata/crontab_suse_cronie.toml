[files."/etc/cron.d/g04notroot"]
path = "/etc/cron.d/g04notroot"
content = """* * * * * root /usr/bin/touch /var/tmp/g04cron/notroot
"""
[files."/etc/cron.d/g04notroot".stat]
mode = 420
uid = 1000
gid = 1000

[files."/etc/cron.d/g04-ok_name"]
