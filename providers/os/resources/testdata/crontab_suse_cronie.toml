# /etc/crontab and /etc/cron.d on SLES 15 SP7 (cronie 1.5.7), names, modes and
# owners as `stat -c "%a %u"` showed them. Every cron.d job touches a marker;
# the markers that appeared each minute were g04, bak, dotted, dpkgold and
# okname. cron's journal: BAD FILE MODE for g04badmode, g04exec and g04worldw,
# WRONG FILE OWNER for g04notroot.

[files."/etc/cron.d"]
path = "/etc/cron.d"
[files."/etc/cron.d".stat]
isdir = true

[files."/etc/crontab"]
path = "/etc/crontab"
content = """SHELL=/bin/sh
PATH=/usr/bin:/usr/sbin:/sbin:/bin:/usr/lib/news/bin
MAILTO=root
-*/15 * * * *   root  test -x /usr/lib/cron/run-crons && /usr/lib/cron/run-crons >/dev/null 2>&1
"""
[files."/etc/crontab".stat]
mode = 384

[files."/etc/cron.d/g04"]
path = "/etc/cron.d/g04"
content = """SHELL=/bin/bash
MAILTO=root
*/5 * * * * root /usr/bin/true g04-a
-*/10 * * * * root /usr/bin/true g04-nolog
* * * * * root /usr/bin/touch /var/tmp/g04cron/g04
"""
[files."/etc/cron.d/g04".stat]
mode = 420

[files."/etc/cron.d/g04~"]
path = "/etc/cron.d/g04~"
content = """* * * * * root /usr/bin/touch /var/tmp/g04cron/tilde
"""
[files."/etc/cron.d/g04~".stat]
mode = 420

[files."/etc/cron.d/g04badmode"]
path = "/etc/cron.d/g04badmode"
content = """* * * * * root /usr/bin/touch /var/tmp/g04cron/badmode
"""
[files."/etc/cron.d/g04badmode".stat]
mode = 436

[files."/etc/cron.d/g04.bak"]
path = "/etc/cron.d/g04.bak"
content = """* * * * * root /usr/bin/touch /var/tmp/g04cron/bak
"""
[files."/etc/cron.d/g04.bak".stat]
