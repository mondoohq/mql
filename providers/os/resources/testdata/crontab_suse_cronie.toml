[files."/etc/cron.d/g04.dotted"]
path = "/etc/cron.d/g04.dotted"
content = """* * * * * root /usr/bin/touch /var/tmp/g04cron/dotted
"""
[files."/etc/cron.d/g04.dotted".stat]
