
# Oracle's mysql:8.0 image. /etc/my.cnf is a plain file holding [mysqld], and
# there is no /etc/mysql/my.cnf at all.

[files."/etc"]
path = "/etc"
[files."/etc".stat]
isdir = true
mode = 16877

[files."/etc/my.cnf.d"]
path = "/etc/my.cnf.d"
[files."/etc/my.cnf.d".stat]
isdir = true
mode = 16877

[files."/etc/mysql"]
path = "/etc/mysql"
[files."/etc/mysql".stat]
isdir = true
mode = 16877

[files."/etc/mysql/conf.d"]
path = "/etc/mysql/conf.d"
[files."/etc/mysql/conf.d".stat]
isdir = true
mode = 16877

[files."/usr"]
path = "/usr"
[files."/usr".stat]
isdir = true
mode = 16877

[files."/usr/sbin"]
path = "/usr/sbin"
[files."/usr/sbin".stat]
isdir = true
mode = 16877

[files."/etc/my.cnf"]
path = "/etc/my.cnf"
content = '''
# For advice on how to change settings please see
# http://dev.mysql.com/doc/refman/8.0/en/server-configuration-defaults.html

[mysqld]
#
# Remove leading # and set to the amount of RAM for the most important data
# cache in MySQL. Start at 70% of total RAM for dedicated server, else 10%.
# innodb_buffer_pool_size = 128M
#
# Remove leading # to turn on a very important data integrity option: logging
# changes to the binary log between backups.
# log_bin
#
# Remove leading # to set options mainly useful for reporting servers.
# The server defaults are faster for transactions and fast SELECTs.
# Adjust sizes as needed, experiment to find the optimal values.
# join_buffer_size = 128M
# sort_buffer_size = 2M
# read_rnd_buffer_size = 2M

# Remove leading # to revert to previous value for default_authentication_plugin,
# this will increase compatibility with older clients. For background, see:
# https://dev.mysql.com/doc/refman/8.0/en/server-system-variables.html#sysvar_default_authentication_plugin
# default-authentication-plugin=mysql_native_password
skip-host-cache
skip-name-resolve
datadir=/var/lib/mysql
socket=/var/run/mysqld/mysqld.sock
secure-file-priv=/var/lib/mysql-files
user=mysql

pid-file=/var/run/mysqld/mysqld.pid
[client]
socket=/var/run/mysqld/mysqld.sock

!includedir /etc/mysql/conf.d/
'''

[files."/usr/sbin/mysqld"]
path = "/usr/sbin/mysqld"
content = ''

