
# AlmaLinux 9 with the mariadb-server package. The root /etc/my.cnf holds only
# a [client-server] header and !includedir /etc/my.cnf.d, which is exactly what
# an Oracle MySQL RPM install also ships, so the product is only identifiable
# after the fragment directory has been expanded.

[files."/etc"]
path = "/etc"
[files."/etc".stat]
isdir = true
mode = 16877

[files."/etc/my.cnf.d"]
path = "/etc/my.cnf.d"
[files."/etc/my.cnf.d".stat]
isdir = true
mode = 16877

[files."/usr"]
path = "/usr"
[files."/usr".stat]
isdir = true
mode = 16877

[files."/usr/libexec"]
path = "/usr/libexec"
[files."/usr/libexec".stat]
isdir = true
mode = 16877

[files."/usr/sbin"]
path = "/usr/sbin"
[files."/usr/sbin".stat]
isdir = true
mode = 16877

[files."/etc/my.cnf"]
path = "/etc/my.cnf"
content = '''
#
# This group is read both both by the client and the server
# use it for options that affect everything
#
[client-server]

#
# include all files from the config directory
#
!includedir /etc/my.cnf.d

'''

[files."/etc/my.cnf.d/auth_gssapi.cnf"]
path = "/etc/my.cnf.d/auth_gssapi.cnf"
content = '''
[mariadb]
#plugin-load-add=auth_gssapi.so
'''

[files."/etc/my.cnf.d/client.cnf"]
path = "/etc/my.cnf.d/client.cnf"
content = '''
#
# These two groups are read by the client library
# Use it for options that affect all clients, but not the server
#


[client]

# This group is not read by mysql client library,
# If you use the same .cnf file for MySQL and MariaDB,
# use it for MariaDB-only client options
[client-mariadb]

'''

[files."/etc/my.cnf.d/enable_encryption.preset"]
path = "/etc/my.cnf.d/enable_encryption.preset"
content = '''
#
# !include this file into your my.cnf (or any of *.cnf files in /etc/my.cnf.d)
# and it will enable data at rest encryption. This is a simple way to
# ensure that everything that can be encrypted will be and your
# data will not leak unencrypted.
#
# DO NOT EDIT THIS FILE! On MariaDB upgrades it might be replaced with a
# newer version and your edits will be lost. Instead, add your edits
# to the .cnf file after the !include directive.
#
# NOTE that you also need to install an encryption plugin for the encryption
# to work. See https://mariadb.com/kb/en/mariadb/data-at-rest-encryption/#encryption-key-management
#
[mariadb]
aria-encrypt-tables
encrypt-binlog
encrypt-tmp-disk-tables
encrypt-tmp-files
loose-innodb-encrypt-log
loose-innodb-encrypt-tables
'''

[files."/etc/my.cnf.d/mariadb-server.cnf"]
path = "/etc/my.cnf.d/mariadb-server.cnf"
content = '''
#
# These groups are read by MariaDB server.
# Use it for options that only the server (but not clients) should see
#
# See the examples of server my.cnf files in /usr/share/mysql/
#

# this is read by the standalone daemon and embedded servers
[server]

# this is only for the mysqld standalone daemon
# Settings user and group are ignored when systemd is used.
# If you need to run mysqld under a different user or group,
# customize your systemd unit file for mysqld/mariadb according to the
# instructions in http://fedoraproject.org/wiki/Systemd
[mysqld]
datadir=/var/lib/mysql
socket=/var/lib/mysql/mysql.sock
log-error=/var/log/mariadb/mariadb.log
pid-file=/run/mariadb/mariadb.pid


#
# * Galera-related settings
#
[galera]
# Mandatory settings
#wsrep_on=ON
#wsrep_provider=
#wsrep_cluster_address=
#binlog_format=row
#default_storage_engine=InnoDB
#innodb_autoinc_lock_mode=2
#
# Allow server to accept connections on all interfaces.
#
#bind-address=0.0.0.0
#
# Optional setting
#wsrep_slave_threads=1
#innodb_flush_log_at_trx_commit=0

# this is only for embedded server
[embedded]

# This group is only read by MariaDB servers, not by MySQL.
# If you use the same .cnf file for MySQL and MariaDB,
# you can put MariaDB-only options here
[mariadb]

# This group is only read by MariaDB-10.5 servers.
# If you use the same .cnf file for MariaDB of different versions,
# use this group for options that older servers don't understand
[mariadb-10.5]

'''

[files."/etc/my.cnf.d/mysql-clients.cnf"]
path = "/etc/my.cnf.d/mysql-clients.cnf"
content = '''
#
# These groups are read by MariaDB command-line tools
# Use it for options that affect only one utility
#

[mysql]

[mysql_upgrade]

[mysqladmin]

[mysqlbinlog]

[mysqlcheck]

[mysqldump]

[mysqlimport]

[mysqlshow]

[mysqlslap]

'''

[files."/etc/my.cnf.d/spider.cnf"]
path = "/etc/my.cnf.d/spider.cnf"
content = '''
[mariadb]
#
# Uncomment line to enable
#
#plugin-load-add = ha_spider

# Read more at https://mariadb.com/kb/en/spider/
'''

[files."/usr/libexec/mariadbd"]
path = "/usr/libexec/mariadbd"
content = ''

[files."/usr/sbin/mysqld"]
path = "/usr/sbin/mysqld"
content = ''

