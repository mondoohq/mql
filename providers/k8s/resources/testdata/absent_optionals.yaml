# Pairs of objects for the absent-optional tests. Every "-bare" object omits the
# optional fields under test; every "-set" object supplies them. The pair proves
# both branches: absent must read null, present must read the stored value.
apiVersion: v1
kind: Pod
metadata:
  name: pod-bare
  namespace: demo
spec:
  containers:
  - name: c
    image: registry.k8s.io/pause:3.10.1
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-set
  namespace: demo
spec:
  terminationGracePeriodSeconds: 45
  activeDeadlineSeconds: 120
  preemptionPolicy: Never
  containers:
  - name: c
    image: registry.k8s.io/pause:3.10.1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-bare
  namespace: demo
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: c
        image: registry.k8s.io/pause:3.10.1
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-set
  namespace: demo
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  backoffLimitPerIndex: 2
  maxFailedIndexes: 3
  podReplacementPolicy: Failed
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: c
        image: registry.k8s.io/pause:3.10.1
status:
  ready: 1
  terminating: 2
  failedIndexes: "1,3"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cj-bare
  namespace: demo
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: c
            image: registry.k8s.io/pause:3.10.1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cj-set
  namespace: demo
spec:
  schedule: "*/5 * * * *"
  startingDeadlineSeconds: 90
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: c
            image: registry.k8s.io/pause:3.10.1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-bare
  namespace: demo
spec:
  selector:
    matchLabels: {app: bare}
  template:
    metadata:
      labels: {app: bare}
    spec:
      containers:
      - name: c
        image: registry.k8s.io/pause:3.10.1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-set
  namespace: demo
spec:
  revisionHistoryLimit: 7
  progressDeadlineSeconds: 450
  selector:
    matchLabels: {app: set}
  template:
    metadata:
      labels: {app: set}
    spec:
      containers:
      - name: c
        image: registry.k8s.io/pause:3.10.1
status:
  collisionCount: 2
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ds-bare
  namespace: demo
spec:
  selector:
    matchLabels: {app: dsbare}
  template:
    metadata:
      labels: {app: dsbare}
    spec:
      containers:
      - name: c
        image: registry.k8s.io/pause:3.10.1
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ds-set
  namespace: demo
spec:
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: dsset}
  template:
    metadata:
      labels: {app: dsset}
    spec:
      containers:
      - name: c
        image: registry.k8s.io/pause:3.10.1
status:
  collisionCount: 1
  currentNumberScheduled: 0
  desiredNumberScheduled: 0
  numberMisscheduled: 0
  numberReady: 0
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sts-bare
  namespace: demo
spec:
  serviceName: svc
  selector:
    matchLabels: {app: stsbare}
  template:
    metadata:
      labels: {app: stsbare}
    spec:
      containers:
      - name: c
        image: registry.k8s.io/pause:3.10.1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sts-set
  namespace: demo
spec:
  serviceName: svc
  revisionHistoryLimit: 4
  selector:
    matchLabels: {app: stsset}
  template:
    metadata:
      labels: {app: stsset}
    spec:
      containers:
      - name: c
        image: registry.k8s.io/pause:3.10.1
status:
  collisionCount: 3
  replicas: 0
  availableReplicas: 0
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-bare
  namespace: demo
spec:
  maxReplicas: 5
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deploy-bare
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-set
  namespace: demo
spec:
  maxReplicas: 5
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deploy-set
status:
  observedGeneration: 9
  currentReplicas: 1
  desiredReplicas: 1
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-bare
  namespace: demo
spec:
  rules:
  - host: bare.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: svc-bare
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-set
  namespace: demo
spec:
  ingressClassName: nginx
  rules:
  - host: set.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: svc-set
            port:
              number: 80
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-bare
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  hostPath:
    path: /tmp/pv-bare
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-set
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  hostPath:
    path: /tmp/pv-set
  claimRef:
    namespace: demo
    name: pvc-set
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-bare
  namespace: demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-set
  namespace: demo
spec:
  storageClassName: fast
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: svc-bare
  namespace: demo
spec:
  selector: {app: bare}
  ports:
  - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-set
  namespace: demo
spec:
  type: LoadBalancer
  internalTrafficPolicy: Local
  externalTrafficPolicy: Local
  ipFamilyPolicy: SingleStack
  loadBalancerClass: example.com/lb
  healthCheckNodePort: 32000
  allocateLoadBalancerNodePorts: false
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 7200
  selector: {app: set}
  ports:
  - port: 80
---
# A LoadBalancer that omits allocateLoadBalancerNodePorts: the field genuinely
# defaults to true for this type, so it must NOT read null.
apiVersion: v1
kind: Service
metadata:
  name: svc-lb-default
  namespace: demo
spec:
  type: LoadBalancer
  selector: {app: lbdefault}
  ports:
  - port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-extname
  namespace: demo
spec:
  type: ExternalName
  externalName: example.com
