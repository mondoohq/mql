apiVersion: v1
kind: Pod
metadata:
  name: secctx
  namespace: default
spec:
  # hostUsers: false is required by the API server before it accepts
  # procMount: Unmasked, so the fixture stays a manifest a cluster would take.
  hostUsers: false
  containers:
  - name: app
    image: nginx:1.25
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 3000
      readOnlyRootFilesystem: true
      capabilities:
        add: ["NET_BIND_SERVICE"]
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
      appArmorProfile:
        type: Localhost
        localhostProfile: mql-verify-profile
      procMount: Unmasked
      seLinuxOptions:
        type: spc_t
        level: s0:c1,c2
  - name: bare
    image: busybox:1.36
